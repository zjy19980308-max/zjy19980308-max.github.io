<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>异常处理 · 流程中台</title>
<link rel="stylesheet" href="ui.css">
<style>
  .page{padding:0;max-width:none;display:flex;position:relative;flex:1;min-height:0}
  .q{width:330px;flex:0 0 330px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
  .q__tabs{display:flex;padding:10px 12px 0;gap:14px;border-bottom:1px solid var(--line-2)}
  .q__tabs button{border:0;background:none;padding:6px 2px 9px;font-size:12.5px;color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent}
  .q__tabs button.is-on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
  .q__l{flex:1;overflow:auto}
  .ex{padding:12px 14px;border-bottom:1px solid var(--line-2);cursor:pointer;transition:background .14s}
  .ex:hover{background:var(--panel-2)}
  .ex.is-on{background:var(--acc-soft)}
  .ex__t{display:flex;align-items:center;gap:7px;margin-bottom:5px}
  .ex__t b{font-size:12.5px;font-weight:600}
  .ex__m{font-size:11.5px;color:var(--ink-3);display:flex;gap:8px;align-items:center}
  .ex__w{margin-left:auto;font-variant-numeric:tabular-nums}
  .d{flex:1;min-width:0;overflow:auto;padding:20px 24px 120px;position:relative}
  .lead{font-size:15px;line-height:1.7;font-weight:500;margin-bottom:14px;max-width:760px}
  .lead em{font-style:normal;background:var(--warn-soft);padding:0 4px;border-radius:3px}
  .three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .ff{border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;background:var(--panel)}
  .ff b{display:block;font-size:11px;color:var(--ink-3);font-weight:500;margin-bottom:6px}
  .ff div{font-size:12.5px;padding:3px 0}
  .ff .hit{background:var(--warn-soft);border-radius:4px;padding:3px 5px;margin:0 -5px;font-weight:600}
  .acc{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
  .acc__h{display:flex;align-items:center;gap:8px;padding:11px 14px;cursor:pointer;font-size:12.5px}
  .acc__b{display:none;padding:0 14px 13px;font-size:12.5px;line-height:1.75;color:var(--ink-2)}
  .acc.is-open .acc__b{display:block}
  .actbar{left:330px}
  .log{font-size:11.5px;color:var(--ink-3);line-height:1.9}
  

  @media (max-width:1180px){.q{width:288px;flex:0 0 288px}.actbar{left:288px}}
  @media (max-width:900px){.q{display:none}.actbar{left:0}}
</style>
</head>
<body data-nav="exc" data-title="异常处理">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
    <header class="top" id="top"></header>
    <div id="topActions"><span class="tag tag--risk"><i class="dot"></i>2 条待你处理</span></div>
    <div class="page">
      <aside class="q">
        <div class="q__tabs" id="qtabs"><button class="is-on" data-qt="0">待我处理 2</button><button data-qt="1">我已处理</button><button data-qt="2">全部</button></div>
        <div class="q__l" id="list"></div>
      </aside>
      <section class="d" id="d"></section>
    </div>
    <div class="actbar" id="bar"></div>
  </div>
</div>
<script src="ui.js"></script>
<script>
(function () {
  var EX = [
    { id: 'PAY-0041', kind: 'Agent 无法判断', tone: 'warn', title: '发票抬头与合同主体不一致', flow: '供应商付款审批', wait: '40 分钟' },
    { id: 'PAY-0039', kind: '审批超时', tone: 'risk', title: '财务总监审批超过 24 小时未处理', flow: '供应商付款审批', wait: '26 小时' },
    { id: 'ONB-0112', kind: '外部系统失败', tone: 'ok', title: '邮箱账号开通接口返回失败', flow: '员工入职权限开通', wait: '已处理' }
  ];
  document.getElementById('list').innerHTML = EX.map(function (x, i) {
    return '<div class="ex' + (i === 0 ? ' is-on' : '') + '" data-i="' + i + '">'
      + '<div class="ex__t"><span class="tag tag--' + x.tone + '">' + x.kind + '</span></div>'
      + '<div style="font-size:12.5px;font-weight:600;margin-bottom:5px">' + x.title + '</div>'
      + '<div class="ex__m"><span>' + x.flow + ' · ' + x.id + '</span><span class="ex__w">' + x.wait + '</span></div></div>';
  }).join('');

  var V = {
    'PAY-0041': {
      lead: '当前节点：<b>三单匹配</b>。发票抬头「<em>华东物流（上海）有限公司</em>」与合同主体「<em>华东物流有限公司</em>」不一致，Agent 无法确认是不是同一家供应商。',
      impact: '¥86,500 付款暂停在第 3 步。该供应商合同约定 9 月 18 日前付款，<b>距截止还有 3 天</b>。',
      evidence: true,
      think: '查询工商信息：两家为母子公司关系，实际控制人一致。历史 6 笔付款均由子公司开票并正常支付。倾向于：属于同一供应商体系，建议人工确认后放行。',
      conf: 'Agent 建议 · 置信度中',
      opts: [
        ['确认放行', '视为同一供应商，继续走后面的审批。需要写依据。', 0],
        ['退回发起人', '退回孙悦补充材料，本次运行暂停等待。', 0],
        ['改派他人处理', '交给财务总监陈立判断。', 0],
        ['终止本次运行', '本次付款申请作废，需要重新发起。', 1]
      ],
      rule: '以后同一母子公司主体视为匹配（生成检查项草稿，待负责人审批）'
    },
    'PAY-0039': {
      lead: '当前节点：<b>财务总监审批</b>。陈立已 <em>26 小时</em>未处理，状态「出差中」，v3 没有给这个节点配代理人。',
      impact: '¥152,000 付款停在第 5 步。同期还有 <b>2 笔</b> 5 万以上付款会走到同一个节点。',
      evidence: false,
      think: 'v3 的财务总监审批没有代理人配置，超时后没有兜底路径。v4 草稿已经补上代理人「刘恒」，发布后同类情况不再发生。',
      conf: 'Agent 建议 · 置信度高',
      opts: [
        ['催办', '再提醒陈立一次，30 分钟内不能重复催。', 0],
        ['改派给代理人 刘恒', '本次由副总监刘恒代批，记录代批原因。', 0],
        ['跳过此审批', '仅流程负责人可选，必须填理由。', 1],
        ['暂停运行', '挂起本次付款，等陈立出差回来。', 0]
      ],
      rule: '以后审批人状态为「出差」时自动转代理人（生成检查项草稿）'
    }
  };
  function render(i) {
    var x = EX[i], v = V[x.id];
    var host = document.getElementById('d'), bar = document.getElementById('bar');
    if (!v) {
      host.innerHTML = '<div class="empty">这条已经处理完了。<br>处理人 周宁 · 今天 09:48 · 改派给 IT 运维重开接口</div>'; bar.innerHTML = ''; return;
    }
    host.innerHTML = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><span class="tag tag--' + x.tone + '">' + x.kind + '</span><span class="tag mono">' + x.id + '</span><span class="dim" style="font-size:11.5px">已等待 ' + x.wait + '</span><span class="dim" style="margin-left:auto;font-size:11.5px">同一条异常同时只能被一个人处理</span></div>'
      + '<p class="lead">' + v.lead + '</p>'
      + '<div class="banner" style="margin-bottom:16px"><span>' + v.impact + '</span></div>'
      + (v.evidence ? '<div class="h-sec">证据对照</div><div class="three" style="margin-bottom:16px">'
          + '<div class="ff"><b>发票</b><div class="hit">华东物流（上海）有限公司</div><div>¥86,500</div><div>2026-09-10 开具</div></div>'
          + '<div class="ff"><b>合同</b><div class="hit">华东物流有限公司</div><div>¥86,500</div><div>HT-2026-0311</div></div>'
          + '<div class="ff"><b>验收单</b><div>PO-7802</div><div>¥86,500</div><div>2026-09-12 验收</div></div>'
          + '</div>' : '')
      + '<div class="acc" id="acc"><div class="acc__h"><span class="agentic">✦ ' + v.conf + '</span><b style="font-weight:500">Agent 的判断过程</b><span class="dim" style="margin-left:auto;font-size:11.5px">展开</span></div>'
      + '<div class="acc__b">' + v.think + '</div></div>'
      + '<div class="h-sec" style="margin-top:18px">处理方式<span class="dim" style="font-weight:400;margin-left:8px">每种方式都写清楚后果；Agent 不能替你选</span></div>'
      + '<div data-optgroup id="opts" style="max-width:760px">'
      + v.opts.map(function (o, k) { return '<div class="opt' + (k === 0 ? ' is-on' : '') + (o[2] ? ' opt--danger' : '') + '" style="margin-bottom:8px" data-k="' + k + '"><b>' + o[0] + (o[2] ? '<span class="tag tag--risk">不可撤销</span>' : '') + '</b><p>' + o[1] + '</p></div>'; }).join('')
      + '</div>'
      + '<label class="field" style="max-width:760px;margin-top:6px"><span>依据 / 理由（必填）</span><textarea class="inp" id="why" placeholder="写清楚你是凭什么做这个决定的，会记进事件流。"></textarea></label>'
      + '<label style="display:flex;gap:8px;align-items:flex-start;font-size:12.5px;max-width:760px"><input type="checkbox" id="mk" style="margin-top:3px"><span>' + v.rule + '</span></label>'
      + '<div class="h-sec" style="margin-top:20px">处理记录</div><p class="log">09:04 系统 · 运行停在三单匹配，转人工<br>09:06 周宁 · 打开查看<br>09:41 高远 · 打开查看（未处理）</p>';
    document.getElementById('acc').querySelector('.acc__h').addEventListener('click', function () { this.parentNode.classList.toggle('is-open'); });
    bar.innerHTML = '<div class="actbar__c"><span class="dim" style="font-size:13px">处理完会回到运行监控，事件流里追加一条人工处理事件</span>'
      + '<div class="right"><button class="btn" id="later" data-toast="已挂起 · 这条异常仍在队列里">稍后处理</button><button class="obtn obtn--yes" id="go">' + v.opts[0][0] + '</button></div></div>';
    var opts = document.getElementById('opts');
    opts.addEventListener('optchange', function (e) {
      var k = +e.detail.dataset.k, o = v.opts[k];
      var b = document.getElementById('go');
      b.textContent = o[0]; b.className = 'obtn ' + (o[2] ? 'obtn--no' : 'obtn--yes');
    });
    document.getElementById('go').addEventListener('click', function () {
      var why = document.getElementById('why');
      if (!why.value.trim()) { why.focus(); return AG.toast('这一步要写依据，会记进事件流', 'warn'); }
      var mk = document.getElementById('mk').checked;
      AG.toast('已处理 · ' + this.textContent + (mk ? ' · 已生成检查项草稿，待负责人审批' : ''));
      setTimeout(function () { location.href = mk ? 'rules.html' : 'runs.html'; }, 1500);
    });
  }
  document.getElementById('qtabs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-qt]'); if (!b) return;
    [].forEach.call(this.querySelectorAll('button'), function (x) { x.classList.toggle('is-on', x === b); });
    var k = +b.dataset.qt, show = k === 0 ? [0, 1] : k === 1 ? [2] : [0, 1, 2];
    [].forEach.call(document.querySelectorAll('#list .ex'), function (el, i) { el.hidden = show.indexOf(i) < 0; });
    var first = document.querySelector('#list .ex:not([hidden])');
    if (first) { first.click(); }
  });
  document.getElementById('list').addEventListener('click', function (e) {
    var x = e.target.closest('.ex'); if (!x) return;
    [].forEach.call(this.querySelectorAll('.ex'), function (n) { n.classList.toggle('is-on', n === x); });
    render(+x.dataset.i);
  });
  render(0);
})();
</script>
</body>
</html>
