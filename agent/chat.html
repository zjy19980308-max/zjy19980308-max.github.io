<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>描述对话 · 流程中台</title>
<link rel="stylesheet" href="ui.css">
<style>
  .page{padding:0;max-width:none;display:flex;position:relative;flex:1;min-height:0}
  /* 左：对话记录 */
  .hist{width:222px;flex:0 0 222px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
  .hist__h{padding:13px 13px 10px}
  .hist__l{flex:1;overflow:auto;padding:0 8px 14px}
  .hist__g{font-size:11px;color:var(--ink-3);padding:11px 6px 5px}
  .hist__i{display:block;padding:7px 8px;border-radius:6px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .14s,color .14s}
  .hist__i:hover{background:var(--panel-2);color:var(--ink)}
  .hist__i.is-on{background:var(--acc-soft);color:var(--acc-ink);font-weight:500}
  /* 中：对话 */
  .conv{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
  .conv__l{flex:1;overflow:auto;padding:26px 28px 10px}
  .thread{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:17px}
  .msg{display:flex;gap:10px;animation:rise .42s cubic-bezier(.23,1,.32,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  .msg--me{justify-content:flex-end}
  .msg--me .bub{background:var(--ink);color:#fff;border-radius:12px 12px 3px 12px;padding:10px 13px;max-width:78%;font-size:13px;line-height:1.62}
  .msg__a{width:24px;height:24px;border-radius:7px;background:var(--ink);color:#fff;display:grid;place-items:center;flex:0 0 24px;margin-top:1px}
  .msg__a svg{width:13px;height:13px}
  .msg__c{font-size:13px;line-height:1.66;padding-top:2px}
  .msg__c p + p{margin-top:8px}
  .think{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:5px 12px 5px 9px}
  .think i{width:5px;height:5px;border-radius:50%;background:var(--acc);animation:bl 1.1s infinite}
  .think i:nth-child(2){animation-delay:.16s}.think i:nth-child(3){animation-delay:.32s}
  @keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}
  /* 追问卡 */
  .q{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:14px 15px;box-shadow:var(--sd);max-width:520px}
  .q__h{display:flex;align-items:center;gap:8px;margin-bottom:11px}
  .q__h b{font-size:13px;font-weight:600}
  .q__n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
  .q__o{display:flex;flex-direction:column;gap:7px}
  .q__o button{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r-s);padding:8px 11px;font-size:12.5px;cursor:pointer;transition:border-color .14s,background .14s,transform .12s}
  .q__o button:hover{border-color:var(--acc-line);background:var(--acc-soft)}
  .q__o button:active{transform:scale(.99)}
  .q__skip{display:inline-block;margin-top:10px;font-size:11.5px;color:var(--ink-3);cursor:pointer;border:0;background:none;padding:0}
  .q__skip:hover{color:var(--ink-2);text-decoration:underline}
  .q.is-done{pointer-events:none;padding:9px 13px;background:var(--panel-2);box-shadow:none}
  .q.is-done .q__o,.q.is-done .q__skip{display:none}
  .q.is-done .q__h{margin-bottom:0;color:var(--ink-3)}
  .q.is-done .q__h b{font-weight:500;font-size:12.5px}
  /* 生成结果卡 */
  .gen{border:1px solid var(--acc-line);background:var(--acc-soft);border-radius:var(--r);padding:13px 14px;max-width:520px}
  .gen__f{display:flex;align-items:center;gap:6px;margin:11px 0;flex-wrap:wrap}
  .nd{font-size:11px;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:3px 7px;white-space:nowrap}
  .nd--c{border-color:var(--risk-line);background:var(--risk-soft);color:var(--risk);font-weight:600}
  .nd--h{border-color:var(--acc-line);color:var(--acc-ink)}
  .gen__a{font-size:11px;color:var(--ink-3)}
  /* owner 2026-09-16：「询问全放在下方，不在文中，文中只显示结果」→ 追问和「生成草稿」都在输入框上方这一条里 */
  .zone{max-width:640px;margin:0 auto 10px;border:1px solid var(--pri-200);background:var(--pri-50);border-radius:12px;padding:12px 14px;animation:rise .32s cubic-bezier(.23,1,.32,1) both}
  .zone__t{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:10px}
  .zone__t svg{width:14px;height:14px;color:#4857e2}
  .zone__n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3);font-weight:400}
  .zone__o{display:flex;gap:8px;flex-wrap:wrap}
  .zone__o button{border:1px solid var(--line);background:#fff;border-radius:var(--r-s);padding:8px 13px;font-size:12.5px;cursor:pointer;transition:border-color .15s,color .15s,background .15s}
  .zone__o button:hover{border-color:#4857e2;color:#4857e2}
  .zone__o button.pri{background:#4857e2;border-color:#4857e2;color:#fff;font-weight:600}
  .zone__o button.pri:hover{background:#393ed7;color:#fff}
  .zone__s{display:block;margin-top:8px;font-size:11.5px;color:var(--ink-3);cursor:pointer}
  .zone__s:hover{color:var(--ink-2);text-decoration:underline;text-underline-offset:2px}
  /* 输入区 */
  .conv__i{padding:12px 28px 20px}
  .box{max-width:640px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sd);padding:10px 10px 8px 14px;transition:border-color .16s,box-shadow .16s}
  .box:focus-within{border-color:var(--acc-line);box-shadow:0 0 0 3px rgba(19,111,99,.08)}
  .box textarea{width:100%;border:0;outline:0;resize:none;font:inherit;font-size:13px;line-height:1.6;max-height:120px;background:transparent}
  .box textarea::placeholder{color:var(--ink-3)}
  .box__b{display:flex;align-items:center;gap:8px;margin-top:4px}
  .box__b .dim{font-size:11px}
  .icon-b{width:27px;height:27px;border-radius:7px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
  .icon-b:hover{background:var(--panel-2);color:var(--ink)}
  .icon-b svg{width:14px;height:14px}
  .send{margin-left:auto;width:29px;height:29px;border-radius:8px;border:0;background:var(--ink);color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .12s}
  .send:active{transform:scale(.94)}
  .send svg{width:15px;height:15px}
  /* 右：规则清单 */
  .rules{width:398px;flex:0 0 398px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
  .rules__h{padding:13px 15px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:8px}
  .rules__h b{font-size:13px;font-weight:600}
  .rules__l{flex:1;overflow:auto;padding:9px 12px 16px}
  .rules__e{padding:52px 22px;text-align:center;color:var(--ink-3);font-size:12.5px;line-height:1.8}
  .rule{border:1px solid var(--line);border-radius:var(--r-s);padding:10px 11px;margin-bottom:8px;animation:rise .44s cubic-bezier(.23,1,.32,1) both;background:var(--panel)}
  .rule--new{border-color:var(--acc-line);background:var(--acc-soft)}
  .rule__t{display:flex;align-items:center;gap:7px;margin-bottom:6px}
  .rule__id{font-family:var(--mono);font-size:11px;color:var(--ink-3);font-weight:600}
  .rule__s{margin-left:auto}
  .rule__q{font-size:12px;color:var(--ink-2);line-height:1.6}
  .rule__i{font-size:12.5px;margin-top:5px;padding-left:9px;border-left:2px solid var(--acc-line)}
  .rule__i em{font-style:normal;font-family:var(--mono);font-size:11.5px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:4px;padding:0 4px}
  .rule__m{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap}
  .rule__src{font-size:11px;color:var(--ink-3)}
  .rules__f{border-top:1px solid var(--line-2);padding:12px 15px;background:var(--panel-2)}
  .rules__sum{font-size:11.5px;color:var(--ink-2);margin-bottom:10px;font-variant-numeric:tabular-nums;line-height:1.5}
  .rules__f .btn{width:100%}
  /* ── 开场态（owner 给的第二张截图）：大标题用衬线，下面一个大输入框 + 三张入口卡 + 最近对话 ── */
  .wel{flex:1;min-width:0;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:72px 32px 48px;background:var(--panel)}
  .wel__in{width:100%;max-width:720px}
  .wel h2{font-family:var(--serif);font-size:44px;font-weight:400;line-height:1.2;text-align:center;letter-spacing:-.01em;margin-bottom:40px}
  .wel__quick{display:flex;gap:10px;padding:10px;background:var(--surf);border:1px solid var(--line);border-radius:14px 14px 0 0;border-bottom:0}
  .wel__quick button{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--panel);font-size:13px;color:var(--ink-2);cursor:pointer;transition:border-color .15s,color .15s,background .15s}
  .wel__quick button:hover{border-color:var(--pri-200);background:var(--pri-50);color:var(--pri)}
  .wel__quick svg{width:15px;height:15px}
  .wel__box{border:1px solid var(--line);border-radius:0 0 14px 14px;background:var(--panel);padding:18px 18px 12px;box-shadow:var(--sd);transition:border-color .16s,box-shadow .16s}
  .wel__box:focus-within{border-color:var(--pri-l);box-shadow:0 0 0 4px rgba(72,87,226,.09)}
  .wel__box textarea{width:100%;border:0;outline:0;resize:none;font:inherit;font-size:15px;line-height:1.6;min-height:52px;background:transparent}
  .wel__box textarea::placeholder{color:var(--ink-3)}
  .wel__row{display:flex;align-items:center;gap:8px;margin-top:6px}
  .wel__chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--ink-2);cursor:pointer}
  .wel__chip i{width:14px;height:14px;border-radius:50%;background:conic-gradient(from 210deg,#8f99cf,#b9bfda,#dcdfeb,#8f99cf);display:block;flex:0 0 14px}
  .wel__send{margin-left:auto;width:32px;height:32px;border-radius:var(--r-m);border:0;background:#323b4f;color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .12s,background .15s}
  .wel__send:hover{background:#1e293b}
  .wel__send:active{transform:scale(.93)}
  .wel__send svg{width:15px;height:15px}
  .wel__cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
  .wel__c{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:22px;box-shadow:var(--sd);transition:border-color .16s,transform .16s}
  .wel__c:hover{border-color:var(--pri-200);transform:translateY(-1px)}
  .wel__c__t{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600}
  .wel__c__g{width:26px;height:20px;border-radius:5px;flex:0 0 26px;position:relative;overflow:hidden;background:var(--surf);border:1px solid var(--line-2)}
  .wel__c__g::before,.wel__c__g::after{content:'';position:absolute;left:4px;height:3px;border-radius:2px}
  .wel__c__g::before{top:5px;width:16px;background:currentColor}
  .wel__c__g::after{top:11px;width:9px;background:currentColor;opacity:.45}
  .wel__c__f{display:flex;align-items:center;font-size:12px;color:var(--ink-3)}
  .wel__c__f svg{width:13px;height:13px;margin-left:auto}
  .wel__recent{margin-top:30px}
  .wel__recent h3{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
  .wel__recent h3 svg{width:14px;height:14px}
  .wel__r{display:flex;align-items:center;gap:10px;padding:9px 4px 9px 14px;border-left:1px solid var(--line);font-size:13px;color:var(--ink-2);cursor:pointer}
  .wel__r:hover{color:var(--ink)}
  .wel__r i{width:6px;height:6px;border-radius:50%;flex:0 0 6px;margin-left:-17px;background:var(--m-blue);box-shadow:0 0 0 3px var(--panel)}
  .wel__r span{margin-left:auto;font-size:12px;color:var(--ink-3)}
  .wel__more{font-size:12px;color:var(--ink-3);padding:8px 0 0 14px;cursor:pointer}
  .wel__more:hover{color:var(--pri)}
  @media (max-width:1240px){.hist{display:none}.rules{width:320px;flex:0 0 320px}}
  @media (max-width:900px){.rules{display:none}.wel h2{font-size:30px}.wel__cards{grid-template-columns:1fr}}
</style>
</head>
<body data-nav="chat" data-title="描述对话" data-back="flows.html">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
    <header class="top" id="top"></header>
    <div id="topActions"><span class="tag tag--acc"><i class="dot"></i>草稿会话 · 未生成</span></div>
    <div class="page">

      <aside class="hist">
        <div class="hist__h"><button class="btn" style="width:100%" id="newChat">＋ 新对话</button></div>
        <div class="hist__l">
          <div class="hist__g">今天</div>
          <a class="hist__i is-on" href="#">供应商付款分级审批</a>
          <a class="hist__i" href="#">员工离职回收账号</a>
          <div class="hist__g">昨天</div>
          <a class="hist__i" href="#">客户退款主管审批</a>
          <a class="hist__i" href="#">合同用印双签</a>
          <div class="hist__g">本周</div>
          <a class="hist__i" href="#">员工入职开通账号</a>
          <a class="hist__i" href="#">报销制度（上传 PDF）</a>
        </div>
      </aside>

      <section class="wel" id="welcome">
        <div class="wel__in">
          <h2>今天想让它搭点什么？</h2>
          <div class="wel__quick">
            <button type="button" data-q="供应商付款要按金额分级审批，5 万以下采购经理批，5 万以上加财务总监，超过 50 万要 CFO，付款前得有人确认一下">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.2l1.5 3.9 3.9 1.5-3.9 1.5L8 13l-1.5-3.9L2.6 7.6l3.9-1.5z"/></svg>搭一条新流程</button>
            <button type="button" data-q="把供应商付款审批的 5 万阈值改成 10 万">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 2.5 13.5 4.5 5.5 12.5 2.5 13.5 3.5 10.5z"/></svg>改现有流程</button>
            <button type="button" data-q="上传《供应商付款管理办法》，按里面的条款生成流程">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.8 4.2 5.4 8.6a2 2 0 0 0 2.8 2.8l4.6-4.6a3.4 3.4 0 0 0-4.8-4.8L3.2 6.8a4.8 4.8 0 0 0 6.8 6.8l3.4-3.4"/></svg>上传制度文件</button>
          </div>
          <div class="wel__box">
            <textarea id="welInp" rows="2" placeholder="把制度用你自己的话说一遍，比如：采购付款超过 10 万需要 CFO 审批……"></textarea>
            <div class="wel__row">
              <button class="wel__chip" type="button" data-toast="可以附一份制度文件，Agent 会逐条抽规则并标出处">＋</button>
              <button class="wel__chip" type="button"><i></i>规则拆解模式 <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" style="width:11px;height:11px"><path d="M4 6.5 8 10.5 12 6.5"/></svg></button>
              <span class="dim" style="font-size:11.5px">Agent 只生成草稿，上线要你自己点</span>
              <button class="wel__send" id="welSend" type="button" aria-label="发送"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3.5M4 7 8 3l4 4"/></svg></button>
            </div>
          </div>

          <div class="wel__cards">
            <a class="wel__c" href="builder.html"><div class="wel__c__t"><span class="wel__c__g" style="color:var(--m-amber)"></span>流程草稿</div><div class="wel__c__f">去配置<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8h9M9 4.5 12.5 8 9 11.5"/></svg></div></a>
            <a class="wel__c" href="runs.html"><div class="wel__c__t"><span class="wel__c__g" style="color:var(--m-blue)"></span>运行监控</div><div class="wel__c__f">看事件流<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8h9M9 4.5 12.5 8 9 11.5"/></svg></div></a>
            <a class="wel__c" href="rules.html"><div class="wel__c__t"><span class="wel__c__g" style="color:var(--m-green)"></span>检查项库</div><div class="wel__c__f">看规则<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8h9M9 4.5 12.5 8 9 11.5"/></svg></div></a>
          </div>

          <div class="wel__recent">
            <h3><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="5.8"/><path d="M8 4.8V8l2.2 1.4"/></svg>最近的对话</h3>
            <div class="wel__r" data-q="供应商付款要按金额分级审批，5 万以下采购经理批，5 万以上加财务总监，超过 50 万要 CFO，付款前得有人确认一下"><i></i>供应商付款分级审批<span>12 分钟前</span></div>
            <div class="wel__r" data-q="员工离职当天回收账号和门禁，设备归还后结算工资"><i style="background:var(--m-amber)"></i>员工离职回收账号<span>昨天</span></div>
            <div class="wel__r" data-q="客户退款超过 5000 元需要主管审批，原路退回"><i style="background:var(--m-green)"></i>客户退款主管审批<span>9 月 14 日</span></div>
            <div class="wel__more">查看更多…</div>
          </div>
        </div>
      </section>

      <section class="conv" id="conv" hidden>
        <div class="conv__l" id="log"><div class="thread" id="thread"></div></div>
        <div class="conv__i">
          <div id="zone"></div>
          <div class="box">
            <textarea id="inp" rows="1" placeholder="描述流程，或上传一份制度文件"></textarea>
            <div class="box__b">
              <button class="icon-b" type="button" aria-label="上传制度文件" data-toast="支持 PDF / Word，Agent 会逐条抽规则并标出处"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.8 4.2 5.4 8.6a2 2 0 0 0 2.8 2.8l4.6-4.6a3.4 3.4 0 0 0-4.8-4.8L3.2 6.8a4.8 4.8 0 0 0 6.8 6.8l3.4-3.4"/></svg></button>
              <span class="dim">Agent 只负责生成草稿，上线要你自己点</span>
              <button class="send" id="send" type="button" aria-label="发送"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3.5M4 7 8 3l4 4"/></svg></button>
            </div>
          </div>
        </div>
      </section>

      <aside class="rules">
        <div class="rules__h">
          <b>规则清单</b>
          <span class="dim" style="font-size:11.5px">把你的话拆成可执行规则</span>
        </div>
        <div class="rules__l" id="rl"><div class="rules__e">还没有规则。<br>说一句你想搭的流程，这里会实时列出 Agent 从你的话里拆出来的规则。</div></div>
        <div class="rules__f">
          <div class="rules__sum" id="sum">0 条规则</div>
          <button class="btn" id="gen" disabled>生成流程草稿</button>
        </div>
      </aside>

    </div>
  </div>
</div>
<script src="ui.js"></script>
<script>
/* 演示脚本：用户说一句 → Agent 拆规则 → 3 个追问 → 补充规则 → 生成草稿。
   追问停在用户点选项那一步，点了才往下走；右侧规则清单随对话实时增删改。 */
(function () {
  var thread = document.getElementById('thread'), log = document.getElementById('log'), rl = document.getElementById('rl'), sum = document.getElementById('sum'), gen = document.getElementById('gen');
  var Q = new URLSearchParams(location.search).get('q');
  var FIRST = Q || '供应商付款要按金额分级审批，5 万以下采购经理批，5 万以上加财务总监，超过 50 万要 CFO，付款前得有人确认一下';
  var rules = [];
  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
  function bottom() { log.scrollTop = log.scrollHeight; }

  function me(t) { var d = document.createElement('div'); d.className = 'msg msg--me'; d.innerHTML = '<div class="bub">' + esc(t) + '</div>'; thread.appendChild(d); bottom(); return d; }
  function ag(html) { var d = document.createElement('div'); d.className = 'msg'; d.innerHTML = '<div class="msg__a">' + AG.svg('spark', 1.3) + '</div><div class="msg__c">' + html + '</div>'; thread.appendChild(d); bottom(); return d; }
  function thinking(t) { return ag('<span class="think"><i></i><i></i><i></i>' + t + '</span>'); }

  function drawRules() {
    if (!rules.length) return;
    rl.innerHTML = rules.map(function (r) {
      return '<div class="rule' + (r.fresh ? ' rule--new' : '') + '">'
        + '<div class="rule__t"><span class="rule__id">' + r.id + '</span>'
        + (r.agent ? '<span class="agentic">' + AG.svg('spark', 1.3) + 'Agent 补充</span>' : '')
        + '<span class="rule__s tag ' + (r.state === '已确认' ? 'tag--ok' : r.state === '待确认' ? 'tag--warn' : '') + '">' + r.state + '</span></div>'
        + '<div class="rule__q">「' + esc(r.raw) + '」</div>'
        + '<div class="rule__i">' + r.read + '</div>'
        + '<div class="rule__m"><span class="rule__src">' + r.src + '</span>'
        + (r.risk ? '<span class="tag tag--risk">' + r.risk + '</span>' : '')
        + (r.rev ? '<span class="rev rev--' + r.rev.toLowerCase() + '">' + r.rev + '</span>' : '') + '</div></div>';
    }).join('');
    var ok = rules.filter(function (r) { return r.state === '已确认'; }).length, ai = rules.filter(function (r) { return r.agent; }).length;
    var c = rules.filter(function (r) { return r.rev === 'C'; }).length;
    sum.textContent = rules.length + ' 条规则 · ' + ok + ' 条已确认 · ' + ai + ' 条 Agent 补充' + (c ? ' · 含 ' + c + ' 个不可逆节点' : '');
    gen.disabled = rules.length < 5;
    setTimeout(function () { rules.forEach(function (r) { r.fresh = false; }); }, 1400);
  }
  function add(r) { r.fresh = true; rules.push(r); drawRules(); }
  function setState(id, s) { rules.forEach(function (r) { if (r.id === id) r.state = s; }); drawRules(); }

  var QS = [
    { n: '1 / 3', q: '付款申请从哪里发起？', o: ['采购单验收完成后自动发起', '应付会计手动发起', '其他…'],
      after: function (a) { add({ id: 'R5', raw: a, read: '触发：采购单验收完成 → 自动创建付款申请', src: '追问 1', state: '已确认' }); } },
    { n: '2 / 3', q: '审批人请假或超时没处理，怎么办？', o: ['自动转给他的代理人', '转给上一级', '暂停并通知流程管理员'],
      after: function (a) { rules.forEach(function (r) { if (r.id === 'R2' || r.id === 'R3') r.read += '<br><span class="dim">超时 24 小时 → ' + esc(a) + '</span>'; }); drawRules(); } },
    { n: '3 / 3', q: '你说的「付款前有人确认」，指的是谁？', o: ['应付会计复核', '财务总监', '发起人本人'],
      after: function (a) { rules.forEach(function (r) { if (r.id === 'R4') { r.read = '执行付款前插入人工确认节点，确认人：' + esc(a); r.state = '已确认'; } }); drawRules(); } }
  ];

  var zone = function () { return document.getElementById('zone'); };
  function clearZone() { zone().innerHTML = ''; }
  function askZone(title, n, opts, onPick, skip) {
    zone().innerHTML = '<div class="zone"><div class="zone__t">' + AG.svg('spark', 1.4) + title
      + (n ? '<span class="zone__n">' + n + '</span>' : '') + '</div>'
      + '<div class="zone__o">' + opts.map(function (o, i) { return '<button type="button" data-i="' + i + '"' + (o.pri ? ' class="pri"' : '') + '>' + (o.t || o) + '</button>'; }).join('') + '</div>'
      + (skip ? '<span class="zone__s" data-skip>' + skip + '</span>' : '') + '</div>';
    zone().onclick = function (e) {
      var sk = e.target.closest('[data-skip]'); if (sk) { onPick(-1); return; }
      var b = e.target.closest('[data-i]'); if (!b) return;
      onPick(+b.dataset.i);
    };
  }
  function ask(i) {
    if (i >= QS.length) return finish();
    var s = QS[i];
    askZone(s.q, s.n, s.o, function (k) {
      var a = k < 0 ? s.o[0] : s.o[k];
      clearZone(); me(a);
      setTimeout(function () { s.after(a); ag('<p class="dim" style="font-size:12.5px">记下了：' + esc(a) + '，右边第 ' + (i + 1) + ' 条规则已更新。</p>'); ask(i + 1); }, 480);
    }, '跳过（使用默认）');
  }

  function finish() {
    var t = thinking('正在检查不可逆动作与边界情况');
    setTimeout(function () {
      t.remove();
      add({ id: 'R6', raw: '执行付款', read: '执行付款是不可逆动作（<em>C</em> 级），已默认在它前面加人工确认', src: 'Agent 补充', state: 'Agent 补充', agent: true, risk: '涉及不可逆操作', rev: 'C' });
      setTimeout(function () {
        add({ id: 'R7', raw: '5 万以上加财务总监', read: '你没说 <em>50,000</em> 整算哪一档，默认归入「5–50 万」，可改', src: 'Agent 补充', state: 'Agent 补充', agent: true, risk: '缺少边界归属' });
        ag('<p>规则清单整理好了，右边可以逐条改。两条是我补的：<b>执行付款前的人工确认</b>，和 <b>5 万整的归属</b>——这两处你说的话里没提，我按最保守的方式填了。</p>');
        askZone('7 条规则都确认过了，现在生成草稿？', '', [{ t: '生成流程草稿', pri: 1 }, '我还有要改的', '再看一遍清单'], function (k) {
          if (k === 0) { clearZone(); doGen(); return; }
          if (k === 1) { clearZone(); ag('<p>行，你直接在下面说要改哪条，比如「把 5 万改成 10 万」。改完我再问你一次。</p>'); document.getElementById('inp').focus(); return; }
          clearZone(); ag('<p class="dim" style="font-size:12.5px">清单在右边，点任意一条可以改它的理解方式。看完在下面告诉我。</p>');
          setTimeout(function () {
            askZone('看完了吗？可以生成草稿了', '', [{ t: '生成流程草稿', pri: 1 }, '我还有要改的'], function (k2) {
              clearZone(); if (k2 === 0) doGen(); else document.getElementById('inp').focus();
            });
          }, 900);
        });
      }, 900);
    }, 1500);
  }

  function start() {
    me(FIRST);
    var t = thinking('正在理解你的描述');
    setTimeout(function () {
      t.remove();
      ag('<p>我从这句话里拆出了 4 条规则，列在右边。</p>');
      var R = [
        { id: 'R1', raw: '5 万以下采购经理批', read: '金额 &lt; <em>50,000</em> → 采购经理审批', src: '对话第 1 句', state: '已确认' },
        { id: 'R2', raw: '5 万以上加财务总监', read: '<em>50,000</em> ≤ 金额 ≤ <em>500,000</em> → 采购经理 → 财务总监', src: '对话第 1 句', state: '已确认' },
        { id: 'R3', raw: '超过 50 万要 CFO', read: '金额 &gt; <em>500,000</em> → 采购经理 → 财务总监 → CFO', src: '对话第 1 句', state: '已确认' },
        { id: 'R4', raw: '付款前得有人确认一下', read: '执行付款前插入人工确认节点（确认人待定）', src: '对话第 1 句', state: '待确认' }
      ];
      R.forEach(function (r, i) { setTimeout(function () { add(r); }, i * 330); });
      setTimeout(function () {
        ag('<p>有 3 个会影响流程结构的点，我一个个问你。</p>');
        setTimeout(function () { ask(0); }, 420);
      }, 1500);
    }, 1700);
  }

  function doGen() {
    gen.disabled = true;
    var t = thinking('正在生成流程草稿');
    setTimeout(function () {
      t.remove();
      ag('<p>已生成 <b>供应商付款审批</b> 草稿，9 个节点。其中 1 个不可逆节点（执行付款）前面已经加了人工确认。</p>'
        + '<div class="gen"><div class="gen__f">'
        + '<span class="nd">提交付款申请</span><span class="nd">三单匹配</span><span class="nd">金额判断</span><span class="nd">采购经理审批</span><span class="nd">财务总监审批</span><span class="nd">CFO 审批</span><span class="nd">生成付款指令</span><span class="nd nd--h">付款前人工确认</span><span class="nd nd--c">执行付款 · C</span>'
        + '</div><div class="gen__a">草稿不会自己上线：要先过体检，再由流程负责人审阅。</div>'
        + '<a class="btn btn--acc btn--s" style="margin-top:11px" href="builder.html">打开配置</a></div>');
      document.querySelector('#top .tag').className = 'tag tag--ok';
      document.querySelector('#top .tag').innerHTML = '<i class="dot"></i>草稿已生成 · 9 个节点';
      clearZone();
    }, 1900);
  }
  gen.addEventListener('click', doGen);

  var inp = document.getElementById('inp');
  inp.addEventListener('input', function () { this.style.height = 'auto'; this.style.height = Math.min(120, this.scrollHeight) + 'px'; });
  function send() {
    var v = inp.value.trim(); if (!v) return;
    inp.value = ''; inp.style.height = 'auto'; me(v);
    var t = thinking('正在理解');
    setTimeout(function () { t.remove(); ag('<p>收到，这条我记成了新规则，加在清单末尾了。要改哪条直接在右边点它。</p>'); add({ id: 'R' + (rules.length + 1), raw: v, read: '按你补充的这句更新规则', src: '对话补充', state: '待确认' }); }, 1300);
  }
  document.getElementById('send').addEventListener('click', send);
  inp.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });

  /* 开场态：点快捷卡 / 回车 / 点最近对话，才切到对话视图（doc 02 阶段 1 空状态） */
  var welcome = document.getElementById('welcome'), conv = document.getElementById('conv');
  function begin(q) {
    FIRST = q || FIRST;
    welcome.hidden = true; conv.hidden = false;
    document.querySelector('.rules').hidden = false;
    start();
  }
  document.querySelector('.rules').hidden = true;
  document.getElementById('welcome').addEventListener('click', function (e) {
    var t = e.target.closest('[data-q]'); if (!t) return;
    begin(t.dataset.q);
  });
  var wi = document.getElementById('welInp');
  document.getElementById('welSend').addEventListener('click', function () { begin(wi.value.trim() || null); });
  wi.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); begin(this.value.trim() || null); } });
  if (Q) setTimeout(function () { begin(Q); }, 250);
  document.getElementById('newChat').addEventListener('click', function () {
    try { localStorage.removeItem('ag_chat'); } catch (e) {}
    location.href = 'chat.html';
  });
})();
</script>
</body>
</html>
