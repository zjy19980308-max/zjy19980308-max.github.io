<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>发起申请 · 审批工作台</title>
<link rel="stylesheet" href="ui.css">
<style>
  .page{max-width:none}
  .boards{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .reco{border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,#fafbff 0%,#fff 62%);box-shadow:var(--sd);margin-bottom:16px;overflow:hidden}
  .reco__h{display:flex;align-items:center;gap:8px;padding:14px 16px 4px}
  .reco__h b{font-size:14px;font-weight:700}
  .reco__h .right{margin-left:auto;font-size:11.5px;color:var(--ink-3)}
  .nores{padding:36px 16px;text-align:center;color:var(--ink-3);font-size:13px}
  .sbar{max-width:440px}   /* owner：搜索框不要那么长 */
  .sbar .gm{margin-left:0;padding-left:12px;border-left:1px solid var(--line)}
</style>
</head>
<body data-app="front" data-nav="new" data-title="发起申请">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
    <header class="top" id="top"></header>
    <div class="page">

      <div class="pagehead">
        <h2>发起申请</h2>
        <span class="sub">先选一张单子。选完之后表单会按这条流程的规则来，可核对的部分 Agent 自动带出。</span>
      </div>

      <div class="boards tabs" id="boards"></div>

      <div class="sbar">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7.2" cy="7.2" r="4.4"/><path d="M10.6 10.6 14 14"/></svg>
        <input id="q" autocomplete="off" placeholder="请输入单据名称、所属分组…">
        <span class="gm" id="gmine" title="只看常用">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.6 9.7 6l3.7.5-2.7 2.6.6 3.7L8 11.1 4.7 12.8l.6-3.7L2.6 6.5 6.3 6z"/></svg>
          只看我常用的
        </span>
      </div>

      <div id="body"></div>

    </div>
  </div>
</div>
<script src="ui.js"></script>
<script>
(function () {
  /* ── 发起申请：整页分类挑单（Figma 1:15305）。上边三大类，分组往下排。
        「未发布」是草稿，只在流程管理页出现，这里不会有。 ── */
  var G = {
    doc:   '<path d="M4.5 2.5h5l3 3v8h-8z"/><path d="M9.5 2.5v3h3"/>',
    money: '<path d="M8 3.6v8.8"/><path d="M5.6 5.4h3.6a1.7 1.7 0 0 1 0 3.4H6.8a1.7 1.7 0 0 0 0 3.4h3.6"/>',
    clock: '<circle cx="8" cy="8" r="5.6"/><path d="M8 4.9V8l2.1 1.3"/>',
    plane: '<path d="M2.6 8.6 13.4 3.2 8.8 13.4l-1.5-3.6z"/>',
    card:  '<rect x="2.4" y="4" width="11.2" height="8" rx="1.4"/><path d="M2.4 6.8h11.2"/>',
    cal:   '<rect x="2.6" y="3.4" width="10.8" height="10" rx="1.4"/><path d="M2.6 6.4h10.8M5.6 2.2v2.2M10.4 2.2v2.2"/>',
    user:  '<circle cx="8" cy="5.5" r="2.5"/><path d="M3.2 13.2c.6-2.3 2.5-3.5 4.8-3.5s4.2 1.2 4.8 3.5"/>',
    users: '<circle cx="6.2" cy="5.6" r="2.2"/><path d="M2.2 13c.5-2 2.1-3.1 4-3.1s3.5 1.1 4 3.1"/><path d="M10.6 4.1a2.2 2.2 0 0 1 0 4.3M11.4 9.9c1.4.3 2.3 1.4 2.6 3.1"/>',
    stamp: '<path d="M4.4 9.4V7a3.6 3.6 0 1 1 7.2 0v2.4"/><rect x="2.8" y="9.4" width="10.4" height="3.8" rx="1.2"/>',
    shield:'<path d="M8 2 13.2 4v4c0 2.9-2.2 4.8-5.2 5.8C5 12.8 2.8 10.9 2.8 8V4z"/><path d="M6 7.9 7.4 9.3 10.2 6.4"/>',
    chart: '<path d="M2.8 13.2h10.4"/><rect x="4" y="7.6" width="2.2" height="4"/><rect x="7.4" y="4.6" width="2.2" height="7"/><rect x="10.8" y="9.2" width="2.2" height="2.4"/>',
    box:   '<path d="M8 2.2 13.4 5v6L8 13.8 2.6 11V5z"/><path d="M2.6 5 8 7.8 13.4 5M8 7.8v6"/>',
    back:  '<path d="M3.2 8a4.8 4.8 0 1 1 1.5 3.5"/><path d="M2.4 4.6v3.2h3.2"/>',
    bolt:  '<path d="M9 1.8 3.8 8.6H8l-1 5.6L12.2 7H8z"/>'
  };
  function tint(c) { return 'rgba(' + parseInt(c.slice(1,3),16) + ',' + parseInt(c.slice(3,5),16) + ',' + parseInt(c.slice(5,7),16) + ',.2)'; }
  function ico(k, c) { return '<i style="background:' + tint(c) + ';color:' + c + '"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + (G[k] || G.doc) + '</svg></i>'; }

  /* 三大类 → 分组 → 单据。t = [名称, 颜色, 图标, 一句说明] */
  var BOARDS = [
    ['approve', '审批与工单', {
      reco: [['付款申请', '#4857e2', 'money', '你本月发起 6 次'], ['日常报销', '#e08a1e', 'doc', '上周刚提过'], ['请假', '#22c55e', 'clock', '常用'], ['出差', '#3b82f6', 'plane', '常用'], ['合同用印', '#6366f1', 'stamp', '法务 + 行政双签'], ['开票申请', '#0ea5e9', 'card', '常用'], ['补卡', '#f59e0b', 'cal', '每月 3 次内']],
      groups: [
        ['财务管理', [['付款申请', '#4857e2', 'money', '按金额自动分档'], ['日常报销', '#e08a1e', 'doc', '发票需与行程一致'], ['差旅报销', '#3b82f6', 'plane', '先有出差单'], ['开票申请', '#0ea5e9', 'card', '开票后不可撤回'], ['收款单', '#f59e0b', 'money', '到账后自动核销'], ['转账申请', '#22c55e', 'back', '仅限内部主体'], ['调薪申请', '#f97316', 'chart', '走 HR + 部门双签']]],
        ['假勤管理', [['请假', '#22c55e', 'clock', '超 3 天需部门总监'], ['出差', '#3b82f6', 'plane', '含行程与预算'], ['补卡', '#f59e0b', 'cal', '每月 3 次内'], ['外出打卡', '#10b981', 'clock', '当天有效'], ['年假', '#f59e0b', 'cal', '按剩余额度校验'], ['加班', '#eab308', 'clock', '需主管确认'], ['产假', '#38bdf8', 'user', '按政策自动算天数'], ['婚假', '#fb7185', 'users', '需提供证明']]],
        ['人事管理', [['入职', '#f59e0b', 'user', '账号与门禁一起开'], ['转正', '#fb7185', 'users', '带考核结论'], ['离职', '#22c55e', 'back', '权限当天回收'], ['调动', '#f97316', 'users', '跨部门需双方同意'], ['权限申请', '#3b82f6', 'shield', '按岗位模板给'], ['招聘', '#22c55e', 'users', '需 HC 已批'], ['合同续签', '#0ea5e9', 'doc', '到期前 30 天提醒']]],
        ['法务管理', [['合同用印', '#4857e2', 'stamp', '法务 + 行政双签'], ['合同审批', '#6366f1', 'doc', '标准模板可跳过法务'], ['证照借用', '#0ea5e9', 'shield', '当日归还'], ['对外发文', '#ef4444', 'doc', '对外发送，不可撤回']]],
        ['业务管理', [['客户退款', '#ef4444', 'back', '含不可逆节点'], ['采购申请', '#4857e2', 'box', '先有预算'], ['固定资产报废', '#f97316', 'box', '需资产管理员核验']]],
        ['其他', [['通用申请', '#94a3b8', 'doc', '没有合适的单子就用这张']]]
      ]
    }],
    ['flow', '工作流', {
      reco: [['供应商付款审批', '#4857e2', 'money', '你是发起人'], ['员工入职权限开通', '#f59e0b', 'user', 'HR 常用'], ['合同用印申请', '#6366f1', 'stamp', '法务常用']],
      groups: [
        ['采购与付款', [['供应商付款审批', '#4857e2', 'money', 'v3 已上线'], ['采购申请', '#4857e2', 'box', 'v2 已上线'], ['供应商准入', '#0ea5e9', 'shield', 'v1 已上线']]],
        ['人事流程', [['员工入职权限开通', '#f59e0b', 'user', 'v5 已上线'], ['员工离职回收', '#22c55e', 'back', '草稿，暂不能发起'], ['调岗调薪', '#f97316', 'chart', 'v2 已上线']]],
        ['法务与合规', [['合同用印申请', '#6366f1', 'stamp', 'v2 已上线'], ['对外发文审批', '#ef4444', 'doc', 'v1 已上线']]]
      ]
    }],
    ['insight', '智能洞察', {
      reco: [['审批时效分析', '#4857e2', 'chart', '本周更新'], ['卡点归因', '#e08a1e', 'bolt', '有 2 条新结论']],
      groups: [
        ['运行分析', [['审批时效分析', '#4857e2', 'chart', '按流程 / 按人看耗时'], ['卡点归因', '#e08a1e', 'bolt', '找出等待最久的节点'], ['转人工率', '#3b82f6', 'chart', '看 Agent 判不了的比例']]],
        ['风险体检', [['不可逆节点盘点', '#ef4444', 'shield', '哪些流程能自动付款'], ['代理人缺失', '#f59e0b', 'users', '谁出差了还没设代理'], ['黑名单命中', '#9c5449', 'shield', '近 30 天拦下的单子']]]
      ]
    }]
  ];

  /* 「平台推荐」是平台推给你的模板；「我常用的」是你自己发起得多的，照样按分组展示 */
  var MINE = ['付款申请', '日常报销', '差旅报销', '请假', '出差', '补卡', '合同用印', '开票申请', '采购申请', '供应商付款审批', '审批时效分析', '卡点归因'];
  var bi = 0, kw = '', onlyMine = false;
  var boardsEl = document.getElementById('boards'), bodyEl = document.getElementById('body');

  function tile(t, g) {
    return '<button class="tile" type="button" data-t="' + t[0] + '" data-g="' + g + '">' + ico(t[2], t[1])
      + '<div><b>' + t[0] + '</b><span>' + t[3] + '</span></div></button>';
  }
  function hit(t, g) { if (!kw) return true; return (t[0] + g + t[3]).toLowerCase().indexOf(kw) >= 0; }

  function paint() {
    boardsEl.innerHTML = BOARDS.map(function (b, i) {
      return '<button type="button" class="' + (i === bi ? 'is-on' : '') + '" data-b="' + i + '">' + b[1] + '</button>';
    }).join('');
    var d = BOARDS[bi][2], h = '', n = 0;

    if (!onlyMine) {
      var reco = d.reco.filter(function (t) { return hit(t, '平台推荐'); });
      if (reco.length) {
        n += reco.length;
        h += '<section class="reco"><div class="reco__h"><b>平台推荐</b><span class="right">平台按你的部门和最近用法推来的模板</span></div>'
          + '<div class="tiles">' + reco.map(function (t) { return tile(t, '平台推荐'); }).join('') + '</div></section>';
      }
    }
    {
      d.groups.forEach(function (g) {
        var list = g[1].filter(function (t) { return hit(t, g[0]) && (!onlyMine || MINE.indexOf(t[0]) >= 0); });
        if (!list.length) return;
        n += list.length;
        h += '<section class="gsec"><div class="gsec__h">'
          + '<svg class="cv" data-fold viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5 8 10.5 12 6.5"/></svg>'
          + '<b data-fold>' + g[0] + '</b><em>' + list.length + '</em></div>'
          + '<div class="gsec__b"><div class="tiles">' + list.map(function (t) { return tile(t, g[0]); }).join('') + '</div></div></section>';
      });
    }
    if (!n) h = '<div class="nores">' + (onlyMine ? '你最近没常用这一类的单子，点上面的「看全部」挑一张。' : '没有匹配「' + kw + '」的单子。换个词，或者用「其他 · 通用申请」。') + '</div>';
    bodyEl.innerHTML = h;
  }
  paint();

  boardsEl.addEventListener('click', function (e) {
    var b = e.target.closest('[data-b]'); if (!b) return;
    bi = +b.dataset.b; paint();
  });
  document.getElementById('q').addEventListener('input', function () { kw = this.value.trim().toLowerCase(); paint(); });
  document.getElementById('gmine').addEventListener('click', function () {
    onlyMine = !onlyMine; this.style.color = onlyMine ? '#4857e2' : '';
    this.lastChild.textContent = onlyMine ? ' 看全部 ' : ' 只看我常用的 '; paint();
  });
  bodyEl.addEventListener('click', function (e) {
    var f = e.target.closest('[data-fold]');
    if (f) { f.closest('.gsec').classList.toggle('fold'); return; }
    var t = e.target.closest('[data-t]');
    if (t) {
      var name = t.dataset.t;
      if (name === '员工离职回收') { AG.toast('「员工离职回收」还是草稿，管理员发布后才能发起'); return; }
      location.href = 'form.html?t=' + encodeURIComponent(name);
    }
  });
})();
</script>
</body>
</html>
