125.0" height="152.0" class="fill"/><rect x="1015.0" y="422.0" width="125.0" height="152.0" class="fill"/><rect x="898" y="392.0" width="228" height="58" rx="6" fill="#083D2A" stroke="#DAAB00" stroke-opacity=".8"/><text x="1012.0" y="416.0" class="t" font-size="18" text-anchor="middle" font-weight="500" >人与文件</text><text x="1012.0" y="436.0" class="am" font-size="10" text-anchor="middle" font-weight="400" >AGENT 01 · 四格等大 · 拖入即共享</text><rect x="1154" y="264" width="176" height="316" class="boxa"/><text x="1242.0" y="416.0" class="t" font-size="18" text-anchor="middle" font-weight="500" >实时转写</text><text x="1242.0" y="436.0" class="am" font-size="10" text-anchor="middle" font-weight="400" >AGENT 02 · 按人分段</text><rect x="1338" y="264" width="134" height="316" class="boxa"/><text x="1405.0" y="416.0" class="t" font-size="18" text-anchor="middle" font-weight="500" >个人工作区</text><text x="1405.0" y="436.0" class="am" font-size="10" text-anchor="middle" font-weight="400" >AGENT 03 · 面板叠放</text><rect x="884.0" y="590" width="143.33333333333334" height="46" rx="6" class="box"/><text x="955.6666666666666" y="619" class="t" font-size="14" text-anchor="middle" font-weight="400" >固定操作区</text><rect x="1035.3333333333333" y="590" width="143.33333333333334" height="46" rx="6" class="box"/><text x="1107.0" y="619" class="t" font-size="14" text-anchor="middle" font-weight="400" >动态功能区</text><rect x="1186.6666666666667" y="590" width="143.33333333333334" height="46" rx="6" class="box"/><text x="1258.3333333333335" y="619" class="t" font-size="14" text-anchor="middle" font-weight="400" >投屏与转换</text><rect x="1338" y="590" width="134" height="46" rx="6" class="boxa"/><text x="1405.0" y="612" class="t" font-size="13" text-anchor="middle" font-weight="400" >个人 agent</text><text x="1405.0" y="628" class="am" font-size="10" text-anchor="middle" font-weight="400" >唤醒对话</text><line x1="760" y1="450.0" x2="840" y2="450.0" class="la" marker-end="url(#ara)"/><text x="110" y="730" class="m" font-si