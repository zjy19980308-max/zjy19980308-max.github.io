<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<style>
  .bg{fill:#083D2A}
  .t{fill:#EED6C8;font-family:'Noto Sans SC','PingFang SC',sans-serif}
  .m{fill:#8FB3A0;font-family:Syne,'Helvetica Neue',Arial,sans-serif;letter-spacing:.18em}
