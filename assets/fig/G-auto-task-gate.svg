<rect class="bg" width="1600" height="900"/><text x="90" y="96" class="d" font-size="48" text-anchor="start" font-weight="400" >AI 进执行链路，每一步产物都过人</text><text x="90" y="132" class="mu" font-size="18" text-anchor="start" font-weight="400" >从运维异常到具体的人 · 让 AI 跑 · 进池要人确认 · 产物要人过 · 内部测试中</text><text x="1510" y="80" class="m" font-size="13" text-anchor="end" font-weight="400" >FIG G · AUTO-TASK GATES</text><text x="90" y="336" class="t" font-size="18" text-anchor="start" font-weight="500" >AI 做</text><text x="90" y="356" class="m" font-size="11" text-anchor="start" font-weight="400" >AI</text><line x1="200" y1="330" x2="1510" y2="330" class="ln2" stroke-dasharray="2 6"/><text x="90" y="476" class="t" font-size="18" text-anchor="start" font-weight="500" >闸门</text><text x="90" y="496" class="m" font-size="11" text-anchor="start" font-weight="400" >GATE</text><line x1="200" y1="470" x2="1510" y2="470" class="ln2" stroke-dasharray="2 6"/><text x="90" y="616" class="t" font-size="18" text-anchor="start" font-weight="500" >人做</text><text x="90" y="636" class="m" font-size="11" text-anchor="start" font-weight="400" >HUMAN</text><line x1="200" y1="610" x2="1510" y2="610" class="ln2" stroke-dasharray="2 6"/><circle cx="250" cy="330" r="24" fill="#083D2A" stroke="#DAAB00" stroke-width="2"/><text x="250" y="335" class="am" font-size="13" text-anchor="middle" font-weight="400" >01</text><text x="250" y="284" class="t" font-size="17" text-anchor="middle" font-weight="500" >运维捕到问题</text><text x="250" y="264" class="mu" font-size="12" text-anchor="middle" font-weight="400" >监控异常</text><circle cx="445" cy="330" r="24" fill="#083D2A" stroke="#DAAB00" stroke-width="2"/><text x="445" y="335" class="am" font-size="13" text-anchor="middle" font-weight="400" >02</text><text x="445" y="284" class="t" font-size="17" text-anchor="middle" font-weight="500" >生成待确认任务</text><text x="445" y="264" class="mu" font-size="12" text-anchor="middle" font-weight="400" >只有 P0/P1 · 24h 一次</text><circle cx="640" cy="610" r="24" fill="#083D2A" stroke="#EED6C8" stroke-width="2"/><text x="640" y="615" class="mb" font-size="13" text-anchor="middle" font-weight="400" >03</text><text x="640" y="668" class="t" font-size="17" text-anchor="middle" font-weight="500" >人工确认进池</text><text x="640" y="690" class="mu" font-size="12" text-anchor="middle" font-weight="400" >不确认不进池</text><circle cx="835" cy="330" r="24" fill="#083D2A" stroke="#DAAB00" stroke-width="2"/><text x="835" y="335" class="am" font-size="13" text-anchor="middle" font-weight="400" >04</text><text x="835" y="284" class="t" font-size="17" text-anchor="middle" font-weight="500" >找到人</text><text x="835" y="264" class="mu" font-size="12" text-anchor="middle" font-weight="400" >部门或 git 提交记录</text><circle cx="1030" cy="330" r="24" fill="#083D2A" stroke="#DAAB00" stroke-width="2"/><text x="1030" y="335" class="am" font-size="13" text-anchor="middle" font-weight="400" >05</text><text x="1030" y="284" class="t" font-size="17" text-anchor="middle" font-weight="500" >落到他的 CSES</text><text x="1030" y="264" class="mu" font-size="12" text-anchor="middle" font-weight="400" >任务出现在他那里</text><circle cx="1225" cy="610" r="24" fill="#083D2A" stroke="#EED6C8" stroke-width="2"/><text x="1225" y="615" class="mb" font-size="13" text-anchor="middle" font-weight="400" >06</text><text x="1225" y="668" class="t" font-size="17" text-anchor="middle" font-weight="500" >设前提</text><text x="1225" y="690" class="mu" font-size="12" text-anchor="middle" font-weight="400" >自动改 · 或等人工</text><circle cx="1420" cy="330" r="24" fill="#083D2A" stroke="#DAAB00" stroke-width="2"/><text x="1420" y="335" class="am" font-size="13" text-anchor="middle" font-weight="400" >07</text><text x="1420" y="284" class="t" font-size="17" text-anchor="middle" font-weight="500" >AI 出产物</text><text x="1420" y="264" class="mu" font-size="12" text-anchor="middle" font-weight="400" >每一次 → 人工查验</text><path d="M276 330 C347.5 330 347.5 330 419 330" class="ln2" marker-end="url(#ar)"/><path d="M471 330 C542.5 330 542.5 610 614 610" class="ln2" marker-end="url(#ar)"/><path d="M666 610 C737.5 610 737.5 330 809 330" class="ln2" marker-end="url(#ar)"/><path d="M861 330 C932.5 330 932.5 330 1004 330" class="ln2" marker-end="url(#ar)"/><path d="M1056 330 C1127.5 330 1127.5 610 1199 610" class="ln2" marker-end="url(#ar)"/><path d="M1251 610 C1322.5 610 1322.5 330 1394 330" class="ln2" marker-end="url(#ar)"/><rect x="638" y="400" width="4" height="140" fill="#DAAB00" opacity=".9"/><rect x="626" y="456" width="28" height="28" transform="rotate(45 640 470)" fill="#083D2A" stroke="#DAAB00" stroke-width="2"/><rect x="1223" y="400" width="4" height="140" fill="#DAAB00" opacity=".9"/><rect x="1211" y="456" width="28" height="28" transform="rotate(45 1225 470)" fill="#083D2A" stroke="#DAAB00" stroke-width="2"/><path d="M1420 356 L1420 584" class="la" marker-end="url(#ara)"/><circle cx="1420" cy="610" r="24" fill="#083D2A" stroke="#EED6C8" stroke-width="2"/><text x="1420" y="615" class="mb" font-size="15" text-anchor="middle" font-weight="400" >✓</text><text x="1420" y="668" class="t" font-size="17" text-anchor="middle" font-weight="500" >人工查验</text><text x="1420" y="690" class="mu" font-size="12" text-anchor="middle" font-weight="400" >每一次产物 · 不得越过人工</text><path d="M1446 610 C1490 610 1490 330 1446 330" class="ds" marker-end="url(#arm)"/><line x1="90" y1="770" x2="1510" y2="770" class="ln2"/><text x="90" y="812" class="t" font-size="15" text-anchor="start" font-weight="400" >不给百分比进度条，给事件流：AI 不知道自己做到百分之几，但知道刚做完哪一步</text><text x="90" y="842" class="mu" font-size="13" text-anchor="start" font-weight="400" >AI 的「已完成」≠ 业务的「已完成」，后一句永远由人说</text></svg>