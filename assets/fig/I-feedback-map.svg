  .am{fill:#DAAB00;font-family:Syne,'Helvetica Neue',Arial,sans-serif;letter-spacing:.18em}
  .mu{fill:#8FB3A0;font-family:'Noto Sans SC','PingFang SC',sans-serif}
  .ln{stroke:#EED6C8;fill:none}
  .ln2{stroke:#EED6C8;fill:none;opacity:.35}
