*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}


html {
  font-size: var(--font-size-md);
  line-height: var(--line-height-md);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  font-family: var(--font-family-cn);
  font-size: var(--font-size-md);
  line-height: var(--line-height-md);
  color: var(--color-text);
  background-color: var(--color-white);
}


h1, h2, h3, h4, h5, h6 {
  font-weight: var(--font-weight-medium);
  color: var(--color-text);
}


a {
  color: var(--color-text-anchor);
  text-decoration: none;
}

a:hover {
  color: var(--color-primary-hover);
}


img {
  max-width: 100%;
  display: block;
}


ul, ol {
  list-style: none;
}


table {
  border-collapse: collapse;
  border-spacing: 0;
}


input,
textarea,
select,
button {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
  border: var(--line-width) solid var(--color-border);
  border-radius: var(--radius);
  outline: none;
}

button {
  cursor: pointer;
  border: none;
  background: none;
}


::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

::-webkit-scrollbar-thumb {
  background: var(--cs-color-scrollbar-thumb);
  border-radius: 3px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--cs-color-scrollbar-thumb-hover);
}

::-webkit-scrollbar-track {
  background: transparent;
}


* {
  scrollbar-width: thin;
  scrollbar-color: var(--cs-color-scrollbar-thumb) transparent;
}

</style>
  <!-- ② 骨架占位样式 -->
  <style>



.ph-text {
  display: inline-flex; align-items: center;
  min-width: 40px; height: 14px; padding: 0 6px;
  background: var(--cs-color-bg-light);
  border-radius: var(--radius-sm);
  font-size: 12px; line-height: 1; white-space: nowrap;
  color: var(--cs-color-text-secondary);
  font-family: var(--font-family-cn);
  vertical-align: middle;
}
.ph-text-sm {
  display: inline-flex; align-items: center;
  min-width: 24px; height: 12px; padding: 0 4px;
  background: var(--cs-color-bg-disabled);
  border-radius: var(--radius-sm);
  font-size: 11px; line-height: 1; white-space: nowrap;
  color: var(--cs-color-text-tertiary);
  font-family: var(--font-family-cn);
  vertical-align: middle;
}

.ph-title {
  display: inline-flex; align-items: center;
  min-width: 80px; height: 18px; padding: 0 8px;
  background: var(--cs-color-bg-light);
  border-radius: var(--radius-sm);
  font-size: 14px; line-height: 1; white-space: nowrap;
  color: var(--cs-color-text-primary);
  font-family: var(--font-family-cn);
}


.ph-icon    { display: inline-block; width: 20px; height: 20px; background: var(--cs-color-border); border-radius: var(--radius-pill); flex-shrink: 0; vertical-align: middle; }
.ph-icon-sm { width: 14px; height: 14px; }
.ph-icon-lg { width: 24px; height: 24px; }


.ph-btn {
  display: inline-flex; align-items: center; justify-content: center;
  height: 32px; min-width: 80px; padding: 0 12px;
  background: var(--cs-color-bg-light);
  border: 1px solid var(--cs-color-border);
  border-radius: var(--radius-sm);
  font-size: 12px; color: var(--cs-color-text-secondary);
  font-family: var(--font-family-cn); white-space: nowrap;
}
.ph-btn-sm { height: 26px; min-width: 56px; padding: 0 8px; font-size: 11px; }


.ph-card {
  background: var(--cs-color-white);
  border: 1px solid var(--cs-color-border);
  border-radius: var(--radius-lg);
  padding: var(--cs-sem-spacing-comp-padding-lg);
}


.ph-area {
  display: block; width: 100%; min-height: 80px;
  background: var(--cs-color-bg-light);
  border: 1px dashed var(--cs-color-border);
  border-radius: var(--radius);
}


.ph-row {
  display: flex; align-items: center; gap: var(--cs-sem-spacing-comp-gap-md);
  padding: var(--cs-sem-spacing-comp-padding-md) var(--cs-sem-spacing-content-inline);
  border-bottom: 1px solid var(--cs-color-border);
}
.ph-row:hover { background: var(--cs-color-bg-hover); }


.ph-chart {
  background: var(--cs-color-bg-disabled);
  border-radius: var(--radius);
  min-height: 240px;
}


.ph-avatar    { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: var(--radius-pill); background: var(--cs-color-border); flex-shrink: 0; font-size: 11px; color: var(--cs-color-text-secondary); font-family: var(--font-family-cn); }
.ph-avatar-lg { width: 48px; height: 48px; font-size: 14px; }
.ph-avatar-xl { width: 72px; height: 72px; font-size: 18px; }


.ph-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px;
  background: var(--cs-color-bg-light);
  border-radius: var(--radius-sm);
  font-size: 11px; line-height: 1.4;
  color: var(--cs-color-text-secondary);
  font-family: var(--font-family-cn);
}
.ph-chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px;
  background: var(--cs-color-bg-light);
  border-radius: var(--radius-pill);
  font-size: 11px; line-height: 1.4;
  color: var(--cs-color-text-secondary);
  font-family: var(--font-family-cn);
}


.ph-progress { position: relative; width: 100%; height: 6px; background: var(--cs-color-bg-light); border-radius: var(--radius-pill); overflow: hidden; }
.ph-progress > span { display: block; height: 100%; background: var(--cs-color-border); border-radius: var(--radius-pill); }
.ph-bar { display: block; width: 100%; height: 8px; background: var(--cs-color-bg-light); border-radius: var(--radius-sm); }


.ph-divider { height: 1px; width: 100%; background: var(--cs-color-border); }


.ph-media {
  position: relative; display: block; width: 100%; aspect-ratio: 16 / 9;
  background: var(--cs-color-bg-disabled);
  border: 1px solid var(--cs-color-border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.ph-media::before {
  content: ""; position: absolute; left: 50%; top: 50%;
  width: 44px; height: 44px; margin: -22px 0 0 -22px;
  background: var(--cs-color-border); border-radius: var(--radius-pill);
}
.ph-media::after {
  content: ""; position: absolute; left: 50%; top: 50%; margin: -8px 0 0 -4px;
  border-style: solid; border-width: 8px 0 8px 13px;
  border-color: transparent transparent transparent var(--cs-color-bg-disabled);
}
.ph-media-43 { aspect-ratio: 4 / 3; }


.ph-tab {
  display: inline-flex; align-items: center;
  height: 28px; padding: 0 10px;
  background: transparent; border-radius: var(--radius-sm);
  font-size: 12px; line-height: 1; white-space: nowrap;
  color: var(--cs-color-text-secondary);
  font-family: var(--font-family-cn);
}
.ph-tab.is-active {
  background: var(--cs-color-bg-light);
  color: var(--cs-color-text-primary);
}


.ph-dot {
  display: inline-block; width: 6px; height: 6px;
  border-radius: var(--radius-pill);
  background: var(--cs-color-border);
  flex-shrink: 0;
}

</style>

cs-main-layout.ml-two,
.cs-main-layout.ml-two {

  <style>
    /* ---- shell 容器（layout.md §五原文）---- */
    .mvl-shell { width: 100%; height: 100vh; background: var(--cs-color-bg-app-dark); display: flex; flex-direction: column; overflow: hidden; }
    .mvl-shell .body { flex: 1; min-height: 0; width: 100%; background: var(--cs-color-bg-app-dark); padding: 0 0 var(--space-xs) 0; display: flex; box-sizing: border-box; }
    .mvl-shell .content-wrapper { flex: 1; min-height: 0; display: flex; border-radius: var(--radius-lg); overflow: hidden; }
    .mvl-shell main.main-content, .mvl-shell .main-content { flex: 1; min-height: 0; background: var(--cs-color-white); display: flex; flex-direction: column; position: relative; }

    /* ---- navbar 片段私有（fragment.css 无此 selector · 沿用同款）---- */
    cs-navbar .slot-header { padding: var(--space-xs) var(--space-2xs); display: flex; flex-direction: column; gap: var(--space-3xs); }
    cs-navbar .slot-action { padding: 0 var(--space-2xs) var(--space-xs); }
    cs-navbar .slot-nav .nav-item, cs-navbar .slot-sub .nav-item { display: flex; align-items: center; gap: var(--space-2xs); height: 36px; padding: 0 var(--space-xs); border-radius: var(--radius-lg); text-decoration: none; color: var(--cs-color-text-secondary); flex-shrink: 0; }
    cs-navbar .slot-nav .nav-item:hover, cs-navbar .slot-sub .nav-item:hover { background: var(--cs-color-bg-hover); }
    cs-navbar .slot-nav .nav-item[data-active="true"] { background: var(--cs-color-bg-light); color: var(--cs-color-text-primary); }
    cs-navbar .nav-count { margin-left: auto; }

    /* ---- 页面私有 · 内容区（.nc-*）---- */
    .nc-page { padding: var(--space-sm); display: flex; flex-direction: column; gap: var(--space-sm); overflow: auto; flex: 1; min-height: 0; }
    /* 归零 ml-col 内边距，由 .nc-page 独担，使内容左缘与 content-header 标题左缘对齐 */
    cs-main-layout.ml-two .ml-col--c1 { padding: 0; }

    .nc-sec-head { display: flex; align-items: center; gap: var(--space-2xs); }
    .nc-sec-title { font-size: var(--typo-cn-body-size); font-weight: var(--font-weight-semibold); color: var(--cs-color-text-primary); }
    .nc-sec-hint { font-size: var(--typo-cn-caption-size); color: var(--cs-color-text-tertiary); }
    .nc-sec-more { margin-left: auto; }

    /* 条目：通用 */
    .nc-item { display: flex; align-items: flex-start; gap: var(--space-xs); padding: var(--space-xs) var(--space-sm); border-radius: var(--radius-lg); }
    .nc-item:hover { background: var(--cs-color-bg-hover); }
    .nc-item-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-2xs); }
    .nc-line { display: flex; align-items: center; gap: var(--space-2xs); flex-wrap: wrap; }
    .nc-item-act { display: flex; align-items: center; gap: var(--space-2xs); flex-shrink: 0; }
    /* A1：跳转型条目 —— 整行可点 + 右侧箭头；行内动作型 —— 行尾按钮。两者不同形 */
    .nc-go { flex-shrink: 0; }

    /* 待我处理区（A/C 方案用）：靠边框和留白与下方区分，零业务色 */
    .nc-todo { border: 1px solid var(--cs-color-border); border-radius: var(--radius-lg); padding: var(--space-xs); display: flex; flex-direction: column; gap: var(--space-3xs); }
    .nc-todo .nc-item { border-bottom: 1px solid var(--cs-color-border-light); border-radius: 0; }
    .nc-todo .nc-item:last-child { border-bottom: 0; }

    /* 时间分组 */
    .nc-group { display: flex; flex-direction: column; gap: var(--space-3xs); }
    .nc-group-h { padding: var(--space-2xs) var(--space-sm); }

    /* B 方案 · 强弱对比：要行动的加左侧竖条并加厚 */
    .nc-item--act { border-left: 3px solid var(--cs-color-border); padding-left: calc(var(--space-sm) - 3px); padding-top: var(--space-sm); padding-bottom: var(--space-sm); }
    .nc-item--mute { opacity: .72; }

    /* C 方案 · 折叠（展开折叠必动画 · grid-rows 0fr→1fr，禁 display 硬切）*/
    /* 🔴 过渡不写在这里，由 JS 在方案变可见之后再挂（.nc-anim）。
       原因：.mvl-variant 默认 display:none，C 方案里的折叠在隐藏状态下建立过渡基线，
       切到可见时 0fr→1fr 的过渡起不来，表现是「点了展开、高度还是 0」。
       expense-claim 的折叠在默认可见的 A 方案里，所以从没暴露过这个。 */
    .nc-fold-body { display: grid; grid-template-rows: 1fr; }
    .nc-anim .nc-fold-body { transition: grid-template-rows .3s ease; }
    .nc-fold[data-open="false"] .nc-fold-body { grid-template-rows: 0fr; }
    /* 🔴 inner 不许写 min-height:0 —— 它会让网格项塌到 0，1fr 跟着解析成 0，
       表现是「点了展开但高度不变」。照 expense-claim 已验证的写法：只 overflow:hidden + flex 列 */
    .nc-fold-inner { overflow: hidden; display: flex; flex-direction: column; }
    .nc-fold-h { display: flex; align-items: center; gap: var(--space-2xs); padding: var(--space-2xs) var(--space-sm); border-radius: var(--radius-lg); cursor: pointer; }
    .nc-fold-h:hover { background: var(--cs-color-bg-hover); }
    .nc-caret { margin-left: auto; transition: transform .3s ease; }
    .nc-fold[data-open="false"] .nc-caret { transform: rotate(-90deg); }

    /* 四态：由 .nc-page[data-state] 驱动 */
    .nc-state { display: none; }
    .nc-page[data-state="normal"]      .nc-state--normal { display: flex; flex-direction: column; gap: var(--space-sm); }

                <div class="nc-state nc-state--loading"><div class="nc-group"><div class="nc-item"><span class="ph-bar"></span></div><div class="nc-item"><span class="ph-bar"></span></div><div class="nc-item"><span class="ph-bar"></span></div></div></div>
                <div class="nc-state nc-state--empty-first"><span class="ph-media"></span><span class="ph-title"></span><span class="ph-text-sm"></span></div>
                <div class="nc-state nc-state--empty-done"><span class="ph-media"></span><span class="ph-title"></span><span class="ph-text-sm"></span><span class="ph-btn"></span></div>
                <div class="nc-state nc-state--error">
                  <div class="nc-sec-head"><span class="nc-sec-title">待我处理</span><span class="nc-sec-hint">独立取数，列表挂了它不受影响</span></div>
                  <div class="nc-todo"><div class="nc-item"><span class="ph-avatar"></span><div class="nc-item-body"><div class="nc-line"><span class="ph-text-sm"></span><span class="ph-text"></span></div></div><div class="nc-item-act"><span class="ph-btn ph-btn-sm"></span></div></div></div>
                  <div class="nc-group" style="align-items:center;padding:var(--space-2xl) 0"><span class="ph-icon ph-icon-lg"></span><span class="ph-text"></span><span class="ph-btn"></span></div>
                </div>
              </div>
            </section>

              </div><!-- /ml-col--c1 -->
            </div><!-- /content-body -->
          </main><!-- /main-content -->
        </cs-main-layout>
      </div>

      <!-- SLOT: space-switcher（右侧 · 可选）-->
      <cs-space-switcher class="space-switcher">
        <div class="slot-tools"><i class="ph-icon"></i><i class="ph-icon"></i><i class="ph-icon"></i></div>
      </cs-space-switcher>
    </div>
  </div>

<script>
(function () {
  var toast = document.getElementById('stub-toast'), tid;
  function stub(msg) {
    toast.textContent = msg + ' · 骨架阶段占位';
    toast.classList.add('show');
    clearTimeout(tid); tid = setTimeout(function () { toast.classList.remove('show'); }, 1600);
  }

  /* ---- 方案切换（§5.5 锁死模板）---- */
  /* 变可见之后再挂过渡：元素在 display:none 里建立的过渡基线是无效的，
     直接带着 transition 显示出来，第一次点展开会卡在 0（本单元实测踩过）。*/
  function armAnim(v) {
    v.classList.remove('nc-anim');
    /* 同步强制一次重排，让「已可见」这个状态先落定，再挂过渡。
       ⚠️ 这里刻意不用 requestAnimationFrame：面板隐藏 / 无头环境下 rAF 根本不派发，
          依赖它的代码会静默不执行（本单元实测踩过：功能对、动画没挂上，还查不出报错）。*/
    void v.offsetHeight;
    v.classList.add('nc-anim');
  }
  var mvl = document.querySelector('.mvl-switcher');
  mvl.addEventListener('click', function (e) {
    var btn = e.target.closest('button'); if (!btn) return;
    mvl.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b === btn); });
    document.querySelectorAll('.mvl-variant').forEach(function (v) {
      if (v.dataset.variant === btn.dataset.target) { v.setAttribute('data-active', ''); armAnim(v); }
      else { v.removeAttribute('data-active'); v.classList.remove('nc-anim'); }
    });
  });
  armAnim(document.querySelector('.mvl-variant[data-active]'));   // 首屏那个也要挂

  /* ---- 四态切换：只改当前显示方案的 .nc-page ---- */
  var sw = document.querySelector('.state-switcher');
  sw.addEventListener('click', function (e) {
    var btn = e.target.closest('button'); if (!btn) return;
    sw.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b === btn); });
    document.querySelectorAll('.nc-page').forEach(function (p) { p.setAttribute('data-state', btn.dataset.state); });
  });

  /* ---- C 方案折叠（grid-rows 0fr→1fr 过渡，禁 display 硬切）---- */
  document.addEventListener('click', function (e) {
    var h = e.target.closest('[data-fold]'); if (!h) return;
    var fold = h.closest('.nc-fold');
    fold.setAttribute('data-open', fold.getAttribute('data-open') === 'true' ? 'false' : 'true');
  });

  /* ---- navbar 三项切换（结构交互：骨架阶段要能点，不是死图）---- */
  document.querySelectorAll('cs-navbar .slot-nav .nav-item').forEach(function (a) {
    a.addEventListener('click', function () {
      document.querySelectorAll('cs-navbar .slot-nav .nav-item').forEach(function (x) {
        x.setAttribute('data-active', x === a ? 'true' : 'false');
      });
      stub(a.dataset.stub || '导航');
    });
  });

  /* ---- 其余灰块点了给桩提示，不留死块 ---- */
  document.addEventListener('click', function (e) {
    if (e.target.closest('[data-fold]') || e.target.closest('cs-navbar .nav-item')) return;
    var item = e.target.closest('.nc-item');
    if (item) { stub(e.target.closest('.nc-item-act') ? '行内动作' : '跳回事情发生的地方'); return; }
    var b = e.target.closest('[data-stub]');
    if (b) stub(b.dataset.stub);
  });
})();
</script>
</body>
</html>
