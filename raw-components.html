<style>
  html,body{height:100%}
  body{margin:0;overflow:hidden;display:flex;flex-direction:column}
  .top{flex:none;background:rgba(255,255,255,.92);border-bottom:1px solid var(--line);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .top-in{padding:14px clamp(14px,2.5vw,28px);display:flex;align-items:center;
    justify-content:space-between;gap:16px;flex-wrap:wrap}
  .back{display:inline-flex;align-items:center;gap:9px;font-family:var(--font-mono);font-size:11.5px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--fg-2);border:1px solid var(--line-2);
    padding:8px 15px;border-radius:6px;transition:background .3s,color .3s,border-color .3s}
  .back:hover{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  .ttl{font-family:var(--font-display);font-weight:600;font-size:16px}
  .ttl span{color:var(--fg-3);font-weight:400;margin-left:10px;font-family:var(--font-mono);
    font-size:11px;letter-spacing:.14em}
  .cnt{font-family:var(--font-mono);font-size:11px;color:var(--fg-4);letter-spacing:.1em}

  .body{flex:1;display:grid;grid-template-columns:236px minmax(0,1fr);min-height:0}
  .rail{border-right:1px solid var(--line);overflow-y:auto;background:var(--bg);padding-bottom:30px}
  .rail::-webkit-scrollbar{width:7px}
  .rail::-webkit-scrollbar-thumb{background:var(--chrome);border-radius:4px}
  .srch{position:sticky;top:0;z-index:2;background:var(--bg);padding:12px 14px 10px;
    border-bottom:1px solid var(--line)}
  .srch input{width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:6px;
    padding:8px 11px;color:var(--fg);font-family:var(--font-mono);font-size:12px;outline:none}
  .srch input:focus{border-color:var(--violet)}
  .rg{padding:12px 0 4px}
  .rg-h{padding:0 15px 8px;font-family:var(--font-mono);font-size:10px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--fg-4);display:flex;justify-content:space-between}
  .ci{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
    padding:8px 15px;background:none;border:0;text-align:left;cursor:pointer;
    font-family:var(--font-mono);font-size:12.5px;color:var(--fg-2);
    border-left:2px solid transparent;transition:background .2s,color .2s,border-color .2s}
  .ci:hover{background:var(--surface);color:var(--fg)}
  .ci.on{background:var(--surface-2);color:var(--fg);border-left-color:var(--violet)}
  .ci i{font-style:normal;font-size:9.5px;color:var(--fg-4);letter-spacing:.06em}
#mn .zh{margin-right:12px}
#mn .en{font-family:var(--fm,ui-monospace,monospace);font-size:.62em;font-weight:400;
        color:var(--fg-4);letter-spacing:.02em;vertical-align:middle}
.ci b{font-weight:500;font-size:13px;letter-spacing:.01em}
.ci em{font-style:normal;font-family:var(--fm,ui-monospace,monospace);font-size:10.5px;
       color:var(--fg-4);letter-spacing:.02em;margin-left:auto;padding-left:10px;
       white-space:nowrap;transition:color .25s}
.ci:hover em,.ci.on em{color:var(--fg-3)}

  .stage{display:flex;flex-direction:column;min-width:0;min-height:0}
  .meta{flex:none;padding:16px clamp(16px,2.4vw,30px);border-bottom:1px solid var(--line);background:var(--bg)}
  .meta h2{font-family:var(--font-mono);font-size:16px;font-weight:500;margin:0;color:var(--fg)}
  .meta p{color:var(--fg-2);font-size:13px;line-height:1.75;margin:8px 0 0;max-width:80ch}
  .meta .files{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
  .meta .files span{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--fg-3);border:1px solid var(--line);
    padding:3px 8px;border-radius:4px}
  .frame{flex:1;min-height:0;background:#f5f5f5;position:relative}
  .frame iframe{width:100%;height:100%;border:0;display:block}
  .frame .none{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);
    color:var(--fg-4);font-family:var(--font-mono);font-size:12px;letter-spacing:.1em}
  /* display:grid 会压过 [hidden] 的浏览器默认 display:none，必须显式写回 */
  .frame .none[hidden]{display:none}
  @media(max-width:820px){
    body{overflow:auto}
    .body{grid-template-columns:1fr}
    .rail{border-right:0;border-bottom:1px solid var(--line);max-height:240px}
    .frame{height:70vh}
  }
</style>
</head>

<script>

ck.html"]}, "drawer": {"d": "从屏幕边缘滑出的覆盖面板，承载详情/表单等次级内容。对标 antd Drawer。默认右滑，含", "f": ["RULES.md", "drawer.css", "drawer.html", "drawer.js"]}, "dropdown": {"d": "下拉菜单组件，承载操作命令、上下文菜单、更多操作入口。对标 ng-zorro Dropdown，真实可 toggle 交互（点击触发器开/关切换、点击外部关闭、ESC 关闭），由 dropdown.js（~60 行 vanilla JS，零", "f": ["RULES.md", "dropdown.css", "dropdown.html", "dropdown.js"]}, "empty": {"d": "空状态组件，用于内容为空时的占位提示。承载图标、描述、可选操作按钮。对标 ng-zorro nz-empty。", "f": ["RULES.md", "empty.css", "empty.html"]}, "form-field": {"d": "表单字段组件——标签 + 控件横向排列，底部下划线分隔。适用于表单详情页、任务编辑面板等场景。", "f": ["RULES.md", "form-field.css", "form-field.html"]}, "input-number": {"d": "带加减步进按钮的数字输入框。对标 ng-zorro InputNumber。纯 CSS 组件，步进按钮的 +/- 行为需业务代码接管。", "f": ["RULES.md", "input-number.css", "input-number.html"]}, "input": {"d": "通用输入框组件（纯输入框），支持三种尺寸、多种交互状态。搜索功能由分子组件 cs-search-input 负责。", "f": ["RULES.md", "input.css", "input.html"]}, "link": {"d": "文本链接组件，用于页面中的可点击文字链接。", "f": ["RULES.md", "link.css", "link.html"]}, "list": {"d": "通用列表容器，承载多行结构化数据。每行有行分隔，支持 hover 高亮。对标 ng-zorro List / antd List。", "f": ["RULES.md", "list.css", "list.html"]}, "modal": {"d": "", "f": ["modal.css", "modal.js"]}, "nav-action-btn": {"d": "导航栏内全宽操作按钮，用于新建任务/文档等主要操作入口。", "f": ["RULES.md", "nav-action-btn.css", "nav-action-btn.html"]}, "nav-group": {"d": "侧边栏可折叠导航分组组件，用于组织\"我的任务\"、\"空间\"等导航区块。", "f": ["RULES.md", "nav-group.css", "nav-group.html"]}, "nav-item": {"d": "二级侧边栏/导航栏中的导航条目，支持图标、文字和右侧计数。", "f": ["RULES.md", "nav-item.css", "nav-item.html"]}, "nav-space": {"d": "侧边栏工作空间导航项组件，带彩色圆形图标和空间名称。", "f": ["RULES.md", "nav-space.css", "nav-space.html"]}, "nav-tree": {"d": "树形导航容器组件，用于文档库侧边栏的空间/知识库树形结构。包裹 cs-tree-item 子项。", "f": ["RULES.md", "nav-tree.css", "nav-tree.html"]}, "pagination": {"d": "分页组件，用于列表数据的分页导航。", "f": ["RULES.md", "pagination.css", "pagination.html"]}, "popover": {"d": "气泡卡片组件，点击触发元素后弹出富内容气泡，承载说明、快捷操作、信息卡等。对标 ng-zorro Popover。必须引入 popover.js（单文件 vanilla JS，复用 dropdown 的 toggle 交互模型）。", "f": ["RULES.md", "popover.css", "popover.html", "popover cker.html", "time-picker.js"]}, "tooltip": {"d": "文字提示组件，鼠标悬浮触发器上时显示轻量气泡。对标 ng-zorro Tooltip。纯 CSS 实现（基于 :hover + opacity 过渡），无需 JS。", "f": ["RULES.md", "tooltip.css", "tooltip.html"]}, "typography": {"d": "排版组件，富文本/文档内容的统一样式容器。约束 h1-h6、段落、引用、行内代码、代码块、列表、链接、分割线的间距与字号，符合 design-principles.md 的标题层级 (14 → 16 → 18 → 20 → 24 → 32)", "f": ["RULES.md", "typography.css", "typography.html"]}, "view-tabs": {"d": "折页式视图切换标签栏。用于多维表格/多维表格顶部切换「表格 / 看板 / 甘特 / 日历 / 地图 / 表单 / 画册」等视图。", "f": ["RULES.md", "view-tabs.css", "view-tabs.html"]}};
const btns = [...document.querySelectorAll('.ci')];
const fr = document.getElementById('fr'), nn = document.getElementById('nn');

function show(name){
  const m = META[name]; if(!m) return;
  btns.forEach(b => b.classList.toggle('on', b.dataset.c === name));
  const zh = (btns.find(x => x.dataset.c === name) || {}).dataset;
  document.getElementById('mn').innerHTML =
    '<span class="zh">' + ((zh && zh.zh) || name) + '</span><span class="en">&lt;cs-' + name + '&gt;</span>';
  document.getElementById('md').textContent = m.d || '—';
  document.getElementById('mf').innerHTML = m.f.map(f => '<span>' + f + '</span>').join('');
  const b = btns.find(x => x.dataset.c === name);
  const has = b && b.dataset.has === '1';
  nn.hidden = has;
  fr.style.visibility = has ? 'visible' : 'hidden';
  if (has) fr.src = 'lib/components/desktop/' + name + '/' + name + '.html';
  history.replaceState(null, '', '#' + name);
  if (b) b.scrollIntoView({block:'nearest'});
}

btns.forEach(b => b.addEventListener('click', () => show(b.dataset.c)));
document.getElementById('q').addEventListener('input', e => {
  const v = e.target.value.trim().toLowerCase();
  btns.forEach(b => b.style.display =
    (!v || b.dataset.c.includes(v) || (b.dataset.zh || '').includes(e.target.value.trim())) ? '' : 'none');
  document.querySelectorAll('.rg').forEach(g => {
    g.style.display = [...g.querySelectorAll('.ci')].some(b => b.style.display !== 'none') ? '' : 'none';
  });
});
show(location.hash.slice(1) in META ? location.hash.slice(1) : 'button');
</script>

<script>
/* 返回按来路走。原先写死 #p-flow，从哪进来都跳流水线。
   记录由本稿在离开前写入 sessionStorage，这里只读不删 ——
   本稿加载时还要用它还原滚动位置。 */
(function(){
  var a = document.querySelector('a[href^="\u4f5c\u54c1\u96c6\u672c\u7a3f"]');
  if (!a) return;
  try {
    var r = JSON.parse(sessionStorage.getItem('zjy:return') || 'null');
    if (r && r.tab) {
      a.setAttribute('href', '\u4f5c\u54c1\u96c6\u672c\u7a3f.html#' + r.tab);
      /* 返回文案也要跟着来路走 —— href 动了文字还写死，等于骗人 */
      var LABEL = {about:'个人介绍','p-flow':'AI 设计流水线','p-nota':'NOTA · AI 原生会议','p-cses':'CSES 企业协作平台'};
      if (LABEL[r.tab]) a.textContent = '\u2190 \u8fd4\u56de ' + LABEL[r.tab];
    }
  } catch (e) {}
})();
</script>
