<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<title>悬停菜单 · 交互小案例 — 张竞元</title>
<!-- 实验场 · 交互小案例 02「悬停菜单」。维护：网站交互调整。
     owner 给了 FlowingMenu（React + GSAP）做参照，这里搬成原生 JS。
     关键那一下：鼠标从哪条边进来，盖板就从哪条边推进来；离开时也朝最近的那条边退出去——
     所以指针的运动方向和面板的运动方向永远是一致的，不会有「从下面进、从上面出」的别扭感。
     判边用的是平方距离（distMetric），不开方，够用也更快。
     跑马灯一次只位移「一份内容的宽度」，所以循环处接得上；份数按视口宽度算。
     ?v=1 出片模式：自己依次划过每一行，不接鼠标。 -->
<style>
  @font-face{font-family:'CaseSC';font-weight:400;font-display:swap;src:url(../assets/fonts/NotoSansSC-400-subset.woff2) format('woff2')}
  @font-face{font-family:'CaseSC';font-weight:700;font-display:swap;src:url(../assets/fonts/NotoSansSC-700-subset.woff2) format('woff2')}
  :root{--ink:#f1eee7;--ground:#0c0c0d;--flip:#f1eee7;--flipInk:#0c0c0d;--line:rgba(241,238,231,.22)}
  html,body{margin:0;height:100%;background:var(--ground);overflow:hidden;font-family:CaseSC,system-ui,sans-serif}
  .wrap{width:100%;height:100%;overflow:hidden;display:flex;flex-direction:column}
  .cap{flex:0 0 auto;padding:18px 22px 10px;color:var(--ink)}
  .cap b{display:block;font-size:15px;font-weight:400;letter-spacing:.06em}
  .cap i{display:block;font-style:normal;font-size:11px;opacity:.45;letter-spacing:.14em;margin-top:3px}
  .menu{flex:1;display:flex;flex-direction:column;margin:0;padding:0;min-height:0}
  .item{flex:1;position:relative;overflow:hidden;text-align:center;border-top:1px solid var(--line)}
  .item:first-child{border-top:0}
  .link{display:flex;align-items:center;justify-content:center;height:100%;position:relative;cursor:pointer;
        text-decoration:none;white-space:nowrap;font-weight:700;font-size:clamp(20px,4.4vh,44px);color:var(--ink);letter-spacing:.04em}
  .mq{position:absolute;inset:0;overflow:hidden;pointer-events:none;background:var(--flip);transform:translate3d(0,101%,0)}
  .mq__wrap{height:100%;width:100%;overflow:hidden}
  .mq__in{display:flex;align-items:center;position:relative;height:100%;width:-moz-fit-content;width:fit-content;will-change:transform}
  .mq__part{display:flex;align-items:center;flex-shrink:0;color:var(--flipInk)}
  .mq__part span{white-space:nowrap;font-weight:700;font-size:clamp(20px,4.4vh,44px);line-height:1;padding:0 1.2vw;letter-spacing:.04em}
  .mq__img{width:clamp(96px,14vw,210px);height:clamp(34px,7vh,72px);margin:0 1.4vw;border-radius:999px;background-size:cover;background-position:50% 50%}
  body.vid .cap{opacity:.55}
</style>
</head>
<body>
<div class="wrap">
  <div class="cap"><b>悬停菜单</b><i>FLOWING MENU</i></div>
  <nav class="menu" id="menu"></nav>
</div>
<script src="../js/vendor/gsap.min.js"></script>
<script>
(function () {
  'use strict';
  var gsap = window.gsap;
  var VIDEO = /[?&]v=1/.test(location.search);
  if (VIDEO) document.body.className = 'vid';
  var SPEED = 15, EASE = { duration: .6, ease: 'expo' };

  var ITEMS = [
    { text: '海报设计', img: '../assets/lab/cards/card-05.jpg' },
    { text: '排版设计', img: '../assets/lab/cards/card-02.jpg' },
    { text: '字体设计', img: '../assets/lab/cards/card-20.jpg' },
    { text: '弧形画廊', img: '../assets/lab/cards/card-06.jpg' }
  ];

  function dist2(x, y, x2, y2) { var a = x - x2, b = y - y2; return a * a + b * b; }   /* 比大小用不着开方 */
  function nearEdge(x, y, w, h) { return dist2(x, y, w / 2, 0) < dist2(x, y, w / 2, h) ? 'top' : 'bottom'; }

  var menu = document.getElementById('menu'), rows = [];
  ITEMS.forEach(function (it) {
    var el = document.createElement('div'); el.className = 'item';
    el.innerHTML = '<a class="link" href="javascript:void 0">' + it.text + '</a>'
      + '<div class="mq"><div class="mq__wrap"><div class="mq__in" aria-hidden="true"></div></div></div>';
    menu.appendChild(el);
    rows.push({ el: el, link: el.querySelector('.link'), mq: el.querySelector('.mq'), inn: el.querySelector('.mq__in'), it: it, tw: null });
  });

  function fill(r) {
    var one = '<div class="mq__part"><span>' + r.it.text + '</span><i class="mq__img" style="background-image:url(' + r.it.img + ')"></i></div>';
    r.inn.innerHTML = one;                                   /* 先放一份，量出一份有多宽 */
    var w = r.inn.firstChild.offsetWidth;
    if (!w) return;
    var n = Math.max(4, Math.ceil(innerWidth / w) + 2);
    r.inn.innerHTML = new Array(n + 1).join(one);
    r.tw && r.tw.kill();
    /* 只位移「一份」的宽度 → 循环处正好接上 */
    r.tw = gsap.fromTo(r.inn, { x: 0 }, { x: -w, duration: SPEED, ease: 'none', repeat: -1 });
  }
  function fillAll() { rows.forEach(fill); }
  fillAll();
  addEventListener('resize', function () { clearTimeout(window.__rt); window.__rt = setTimeout(fillAll, 120); });

  function enter(r, x, y) {
    var b = r.el.getBoundingClientRect(), e = nearEdge(x - b.left, y - b.top, b.width, b.height);
    gsap.timeline({ defaults: EASE })
      .set(r.mq, { y: e === 'top' ? '-101%' : '101%' }, 0)
      .set(r.inn, { y: e === 'top' ? '101%' : '-101%' }, 0)
      .to([r.mq, r.inn], { y: '0%' }, 0);
  }
  function leave(r, x, y) {
    var b = r.el.getBoundingClientRect(), e = nearEdge(x - b.left, y - b.top, b.width, b.height);
    gsap.timeline({ defaults: EASE })
      .to(r.mq, { y: e === 'top' ? '-101%' : '101%' }, 0)
      .to(r.inn, { y: e === 'top' ? '101%' : '-101%' }, 0);
  }

  if (!VIDEO) rows.forEach(function (r) {
    r.link.addEventListener('mouseenter', function (e) { enter(r, e.clientX, e.clientY); });
    r.link.addEventListener('mouseleave', function (e) { leave(r, e.clientX, e.clientY); });
  });
  else {
    /* 出片：自己依次划过，进出各从不同边，正好把「跟着指针方向走」这件事演出来。
       用 GSAP 时间线而不是 setTimeout——定步出片时要靠 gsap.updateRoot 推进，setTimeout 推不动。 */
    var HOLD = 1.7, REST = .9, CYCLE = rows.length * (HOLD + REST);
    /* 离线出片：必须把 root 从 ticker 上「摘下来」。
       gsap.ticker.sleep() 拦不住——一创建新 tween GSAP 会自动 wake，时间线会在录制开始前自己跑掉一截；
       而且 updateRoot 用的是绝对时间，得以「时间线创建那一刻的 root 时间」为基准，否则等于倒带。 */
    gsap.ticker.remove(gsap.updateRoot);
    var base = gsap.globalTimeline.time();
    var tl = gsap.timeline({ repeat: -1 });
    rows.forEach(function (r, k) {
      var fromTop = (k % 2 === 0);
      tl.call(function () { var b = r.el.getBoundingClientRect(); enter(r, b.left + b.width / 2, fromTop ? b.top + 2 : b.bottom - 2); })
        .to({}, { duration: HOLD })
        .call(function () { var b = r.el.getBoundingClientRect(); leave(r, b.left + b.width / 2, fromTop ? b.bottom - 2 : b.top + 2); })
        .to({}, { duration: REST });
    });
    var vt = 0;
    window.__case = { cycle: function () { return CYCLE; }, step: function (dt) { vt += dt; gsap.updateRoot(base + vt); }, ready: function () { return true; } };
  }
})();
</script>
</body>
</html>
