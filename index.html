<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<script>/* 线上 1.0 是单页锚点结构（#p-flow 这类），2.0 把项目拆成了独立页面。
   以前发出去的锚点链接落到这里会停在首页顶部、看着像没反应，所以在渲染前先接一下。
   五个锚点和 2.0 的项目 key 正好一一对应。维护：网站交互调整。 */
(function(){var m={"p-cses":"cses","p-doc":"doc","p-flow":"flow","p-nota":"nota","p-plan":"plan"};
var k=location.hash.replace("#","");if(m[k])location.replace("project.html?p="+m[k]);})();</script>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<title>张竞元 — AI 产品设计师</title>
<script>/* 从别的页切过来：先把遮罩铺满，避免闪出页面（transition.js） */try{var t=+sessionStorage.getItem('v7-pt');if(t&&Date.now()-t<10000)document.documentElement.classList.add('pt-arriving')}catch(e){}</script>
<link rel="stylesheet" href="css/fonts-noto.css?v=53">
<link rel="stylesheet" href="css/gradual-blur.css?v=31">
<link rel="stylesheet" href="css/style.css?v=88">
</head>
<body>
<!-- 第一段：加载器 / 导航 / 首屏 / 大字段 / 自我介绍。结构与类名照原站 leoparpeix.com 的 DOM 重建，样式值见 css 注释。 -->
<div class="pageTransition" id="pageTransition" aria-hidden="true"></div>
<div class="loaderBlock" id="loader">
  <div class="gridWrapper hasPadding loaderBlock__container">
    <div class="container__title"><h2 class="title__content" id="ldTitle"></h2></div>
    <div class="container__infos"><h3 class="infos__content" id="ldInfos"></h3></div>
    <div class="container__bottom"><div class="bottom__progress"><div class="progress__content" id="ldProg">
      <svg class="progress__circle" width="8" height="8" viewBox="0 0 8 8" fill="none" aria-hidden="true"><circle class="circle--inactive" opacity=".2" cx="4" cy="4" r="3.25" stroke="currentColor" stroke-width="1"/><g transform="rotate(-90 4 4)"><circle class="circle--animated" cx="4" cy="4" r="3.25" stroke="currentColor" stroke-width="1"/></g></svg>
      <p class="progress__text" id="ldText"></p>
    </div></div></div>
  </div>
</div>

<header class="navbarBlock" id="nav">
  <div class="gridWrapper hasPadding navbarBlock__left">
    <h1 class="left__title"><a class="mainButton" href="#top" id="navName"></a></h1>
    <h3 class="left__infos" id="navRole"></h3>
  </div>
  <div class="gridWrapper hasPadding navbarBlock__right"><nav class="right__links" id="navLinks"></nav></div>
</header>

<div class="sceneLayer" id="scene" aria-hidden="true"></div>

<main class="page" id="top">
  <section class="gridWrapper hasPadding headerBlock" id="header">
    <div class="headerBlock__content" id="headerContent">
      <div class="textComponent content__description"><p class="textComponent__content" id="headerDesc"></p></div>
      <div class="textComponent content__scrollIndication"><p class="textComponent__content" id="headerScroll"></p></div>
    </div>
  </section>

  <section class="webglBg heroBlock" id="hero">
    <div class="gridWrapper hasPadding heroBlock__top">
      <p class="top__city" id="heroLeft"></p>
      <p class="top__star">*</p>
      <div class="top__infos" id="heroRight"></div>
    </div>
    <div class="beeBlock" id="bee">
      <div class="beeBlock__container" id="beeBox">
        <div class="container__titles--default" id="titlesA"></div>
        <div class="container__titles--reveal" id="titlesB"></div>
      </div>
      <span class="indication textComponent"><span class="textComponent__content" id="beeHint"></span></span>
    </div>
  </section>

  <section class="webglBg introBlock" id="about">
    <div class="gridWrapper hasPadding introBlock__top">
      <div class="top__baseline" id="introBaseline"></div>
    </div>
    <div class="gridWrapper hasPadding introBlock__bottom">
      <p class="bottom__stars">*</p>
      <div class="bottom__text" id="introTexts"></div>
    </div>
  </section>

  <!-- 第二段：精选项目（每个项目一条可拖动横滑图 + 信息行）/ 大字过渡（逐字随滚动亮起）/ 其他作品（点开展开）。结构照原站 projectBlock · webglSectionBlock · archivesBlock，内容在 copy.js 的 V7.work，由 js/work.js 渲染 -->
  <div class="workList" id="work"></div>
  <section class="archivesBlock" id="archives">
    <div class="gridWrapper hasPadding archivesBlock__title"><h3 class="title__text" id="archTitle"></h3></div>
    <div class="archivesBlock__list" id="archList"></div>
  </section>
  <!-- 第三段：页脚。大字点一下换一组（同关于页），下面是联系方式，点击复制 -->
  <section class="aboutFooter" id="homeFooter">
    <div class="beeBlock aboutFooter__titles">
      <div class="beeBlock__container" id="hfBox">
        <div class="container__titles--default" id="hfA"></div>
        <div class="container__titles--reveal" id="hfB"></div>
      </div>
    </div>
    <div class="gridWrapper hasPadding aboutFooter__bottom">
      <p class="bottom__left" id="hfLeft"></p>
      <div class="bottom__links" id="hfLinks"></div>
      <p class="bottom__right" id="hfCopy"></p>
    </div>
  </section>
</main>


<script src="js/vendor/gsap.min.js"></script>
<script src="js/vendor/lenis.min.js"></script>
<script src="js/vendor/three.bundle.js"></script>
<script src="js/vendor/RoomEnvironment.js"></script>
<script src="js/vendor/cannon.min.js"></script>
<script src="js/logo-path.js?v=31"></script>
<script src="js/logo3d.js?v=31"></script>
<script src="js/copy.js?v=51"></script>
<script src="js/nav-theme.js?v=19"></script>
<script src="js/transition.js?v=32"></script>
<script src="js/app.js?v=40"></script>
<script src="js/visual-ar.js?v=27"></script>
<script src="js/slider.js?v=36"></script>
<script src="js/depth.js?v=30"></script>
<script src="js/work.js?v=42"></script>
<script src="js/warm-room.js?v=31"></script>
<script src="js/fx-config.js?v=34"></script>
<script src="js/scene.js?v=46"></script>
<script src="js/cursor-fx.js?v=34"></script>
<script src="js/gradual-blur.js?v=31"></script>
<script>
/* 页面顶部渐进模糊（owner：头部加模糊，免得导航和滚上来的内容互相干扰）。参数同项目页：高 4.5rem、强度 1.25；zIndex -97 → 实际 3，在导航（4）之下 */
(function () { if (!window.GradualBlur) return; var MOB = matchMedia('(max-width:760px)').matches;
  GradualBlur.mount(null, { preset: 'page-header', zIndex: -97, height: MOB ? '2.5rem' : '4.5rem', strength: MOB ? .75 : 1.25, curve: 'ease-out' }); })();
</script>
</body>
</html>
