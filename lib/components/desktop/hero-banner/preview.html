<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>cs-hero-banner preview</title>
  <link rel="stylesheet" href="../../../../css/base.css">
  <link rel="stylesheet" href="../../../../fonts/cses-icons.css">
  <link rel="stylesheet" href="../../../css/workspace.css">
  <link rel="stylesheet" href="hero-banner.css">
  <style>body{padding:24px;background:#F5F6FA;font-family:PingFang SC;}</style>
</head>
<body>
  <cs-hero-banner>
    <div class="hero-content">
      <div class="hero-greeting">早上好，Alex 👋</div>
      <div class="hero-summary">
        4 月 28 日 周二 · 你有 <b>3 个待办</b>、<b>2 个会议</b>，AI 已替你完成 <b>12 项</b>
      </div>
    </div>
    <div class="hero-shortcuts">
      <button class="hero-shortcut"><i class="cses-renwu"></i>每日签到</button>
      <button class="hero-shortcut"><i class="cses-add"></i>创建任务</button>
      <button class="hero-shortcut"><i class="cses-rili"></i>快速会议</button>
      <button class="hero-shortcut"><i class="cses-document"></i>创建文档</button>
    </div>
    <div class="hero-illustration">🚀</div>
  </cs-hero-banner>
</body>
</html>
