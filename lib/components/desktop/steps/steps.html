<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>cs-steps 组件预览</title>
  <link rel="stylesheet" href="../../../css/token.css">
  <link rel="stylesheet" href="../../../css/variable.css">
  <link rel="stylesheet" href="../../../css/base.css">
  <link rel="stylesheet" href="../../../fonts/cses-icons.css?v=101">
  <link rel="stylesheet" href="steps.css">
  <style>
    body { padding: 32px; background: var(--cs-color-bg-light); font-family: "PingFang SC", sans-serif; }
    .section { background: var(--cs-color-bg); border-radius: 8px; padding: 24px 32px; margin-bottom: 24px; box-shadow: var(--cs-shadow-card); }
    .section-title { font: var(--typo-cn-16-medium); color: var(--cs-color-text); margin-bottom: 8px; }
    .section-subtitle { font: var(--typo-cn-12-regular); color: var(--cs-color-text-light2); margin-bottom: 24px; }
  </style>
</head>
<body>

<!-- 主模板（业务装配复制此段）：4 阶段工单流转 -->
<div class="section">
  <div class="section-title">工单状态流转 · 进行中</div>
  <div class="section-subtitle">已处理 2 步 · 当前正在「处理中」</div>
  <cs-steps>
    <div class="cs-steps__item" data-status="done">
      <span class="cs-steps__icon"><i class="cses-check_arrow"></i></span>
      <span class="cs-steps__label">待处理</span>
      <span class="cs-steps__desc">05-18 09:30</span>
    </div>
    <div class="cs-steps__item" data-status="active">
      <span class="cs-steps__icon">2</span>
      <span class="cs-steps__label">处理中</span>
      <span class="cs-steps__desc">王伟 · 12 分钟前</span>
    </div>
    <div class="cs-steps__item" data-status="pending">
      <span class="cs-steps__icon">3</span>
      <span class="cs-steps__label">已解决</span>
      <span class="cs-steps__desc">--</span>
    </div>
    <div class="cs-steps__item" data-status="pending">
      <span class="cs-steps__icon">4</span>
      <span class="cs-steps__label">已关闭</span>
      <span class="cs-steps__desc">--</span>
    </div>
  </cs-steps>
</div>

<!-- 终态：已关闭 -->
<div class="section">
  <div class="section-title">工单状态流转 · 已关闭</div>
  <div class="section-subtitle">流程结束 · 最后一步为关闭态</div>
  <cs-steps>
    <div class="cs-steps__item" data-status="done">
      <span class="cs-steps__icon"><i class="cses-check_arrow"></i></span>
      <span class="cs-steps__label">待处理</span>
    </div>
    <div class="cs-steps__item" data-status="done">
      <span class="cs-steps__icon"><i class="cses-check_arrow"></i></span>
      <span class="cs-steps__label">处理中</span>
    </div>
    <div class="cs-steps__item" data-status="done">
      <span class="cs-steps__icon"><i class="cses-check_arrow"></i></span>
      <span class="cs-steps__label">已解决</span>
    </div>
    <div class="cs-steps__item" data-status="closed">
      <span class="cs-steps__icon"><i class="cses-guanbi"></i></span>
      <span class="cs-steps__label">已关闭</span>
      <span class="cs-steps__desc">05-19 14:20</span>
    </div>
  </cs-steps>
</div>

<!-- 小尺寸 -->
<div class="section">
  <div class="section-title">小尺寸 sm</div>
  <div class="section-subtitle">紧凑场景：列表行内嵌 / 卡片头部</div>
  <cs-steps data-size="sm">
    <div class="cs-steps__item" data-status="done">
      <span class="cs-steps__icon"><i class="cses-check_arrow"></i></span>
      <span class="cs-steps__label">待处理</span>
    </div>
    <div class="cs-steps__item" data-status="active">
      <span class="cs-steps__icon">2</span>
      <span class="cs-steps__label">处理中</span>
    </div>
    <div class="cs-steps__item" data-status="pending">
      <span class="cs-steps__icon">3</span>
      <span class="cs-steps__label">已解决</span>
    </div>
    <div class="cs-steps__item" data-status="pending">
      <span class="cs-steps__icon">4</span>
      <span class="cs-steps__label">已关闭</span>
    </div>
  </cs-steps>
</div>

<!-- 初态：全 pending -->
<div class="section">
  <div class="section-title">工单状态流转 · 新建</div>
  <div class="section-subtitle">所有阶段未开始</div>
  <cs-steps>
    <div class="cs-steps__item" data-status="active">
      <span class="cs-steps__icon">1</span>
      <span class="cs-steps__label">待处理</span>
      <span class="cs-steps__desc">刚刚</span>
    </div>
    <div class="cs-steps__item" data-status="pending">
      <span class="cs-steps__icon">2</span>
      <span class="cs-steps__label">处理中</span>
    </div>
    <div class="cs-steps__item" data-status="pending">
      <span class="cs-steps__icon">3</span>
      <span class="cs-steps__label">已解决</span>
    </div>
    <div class="cs-steps__item" data-status="pending">
      <span class="cs-steps__icon">4</span>
      <span class="cs-steps__label">已关闭</span>
    </div>
  </cs-steps>
</div>

</body>
</html>
