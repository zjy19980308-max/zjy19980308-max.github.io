<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>cs-search-trigger 组件预览</title>
  <link rel="stylesheet" href="../../../css/base.css">
  <link rel="stylesheet" href="../../../fonts/cses-icons.css">
  <link rel="stylesheet" href="search-trigger.css">
  <style>
    body { padding: 32px; background: #f5f5f5; }
    .section { background: #fff; border-radius: 8px; padding: 24px; margin-bottom: 24px; }
    .section-title { font: var(--typo-cn-16-medium); color: var(--cs-color-text); margin-bottom: 16px; }
    .row { display: flex; align-items: center; gap: 24px; margin-bottom: 16px; }
    .row-label { font: var(--typo-cn-12-regular); color: var(--cs-color-text-light2); width: 60px; flex-shrink: 0; }
  </style>
</head>
<body>

<div id="screenshot-target">

  <!-- 默认态 -->
  <div class="section">
    <div class="section-title">搜索触发按钮 Search Trigger</div>

    <div class="row">
      <span class="row-label">默认</span>
      <cs-search-trigger>
        <span class="trigger-text">搜索</span>
        <i class="trigger-icon cses-sousuo"></i>
      </cs-search-trigger>
    </div>

    <div class="row">
      <span class="row-label">悬浮</span>
      <cs-search-trigger style="background: var(--cs-color-bg-hover);">
        <span class="trigger-text">搜索</span>
        <i class="trigger-icon cses-sousuo"></i>
      </cs-search-trigger>
    </div>

    <div class="row">
      <span class="row-label">禁用</span>
      <cs-search-trigger data-disabled>
        <span class="trigger-text">搜索</span>
        <i class="trigger-icon cses-sousuo"></i>
      </cs-search-trigger>
    </div>
  </div>

</div>

</body>
</html>
