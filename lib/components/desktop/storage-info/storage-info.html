<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>cs-storage-info 组件预览</title>
  <link rel="stylesheet" href="../../../css/base.css">
  <link rel="stylesheet" href="../../../fonts/cses-icons.css?v=101">
  <link rel="stylesheet" href="storage-info.css">
  <style>
    body { padding: 32px; background: #f5f5f5; }
    .section { background: #fff; border-radius: 8px; padding: 24px; margin-bottom: 24px; }
    .section-title { font: var(--typo-cn-16-medium); color: var(--cs-color-text); margin-bottom: 16px; }
    .section-subtitle { font: var(--typo-cn-12-regular); color: var(--cs-color-text-light2); margin-bottom: 16px; }
    .row { display: flex; align-items: flex-start; gap: 24px; margin-bottom: 16px; flex-wrap: wrap; }
    .row-label { font: var(--typo-cn-12-regular); color: var(--cs-color-text-light2); width: 80px; flex-shrink: 0; }
    .demo-box { width: 220px; }
  </style>
</head>
<body>

<!-- 默认状态 -->
<div class="section">
  <div class="section-title">默认状态</div>
  <div class="section-subtitle">正常用量，蓝色进度条</div>

  <div class="row">
    <span class="row-label">正常用量</span>
    <div class="demo-box">
      <cs-storage-info>
        <div class="storage-header">
          <i class="storage-icon cses-wenjian"></i>
          <span class="storage-label">云空间</span>
        </div>
        <span class="storage-usage">120GB/500GB</span>
        <div class="storage-progress">
          <div class="storage-progress-fill" style="width: 24%;"></div>
        </div>
        <a class="storage-upgrade" href="#">升级</a>
      </cs-storage-info>
    </div>
  </div>

  <div class="row">
    <span class="row-label">中等用量</span>
    <div class="demo-box">
      <cs-storage-info>
        <div class="storage-header">
          <i class="storage-icon cses-wenjian"></i>
          <span class="storage-label">云空间</span>
        </div>
        <span class="storage-usage">480GB/500GB</span>
        <div class="storage-progress">
          <div class="storage-progress-fill" style="width: 96%;"></div>
        </div>
        <a class="storage-upgrade" href="#">升级</a>
      </cs-storage-info>
    </div>
  </div>
</div>

<!-- 警告状态 -->
<div class="section">
  <div class="section-title">警告状态</div>
  <div class="section-subtitle">data-warning：用量超过 90%，进度条变橙色</div>

  <div class="row">
    <span class="row-label">超 90%</span>
    <div class="demo-box">
      <cs-storage-info data-warning>
        <div class="storage-header">
          <i class="storage-icon cses-wenjian"></i>
          <span class="storage-label">云空间</span>
        </div>
        <span class="storage-usage">480GB/500GB</span>
        <div class="storage-progress">
          <div class="storage-progress-fill" style="width: 96%;"></div>
        </div>
        <a class="storage-upgrade" href="#">升级</a>
      </cs-storage-info>
    </div>
  </div>

  <div class="row">
    <span class="row-label">满容量</span>
    <div class="demo-box">
      <cs-storage-info data-warning>
        <div class="storage-header">
          <i class="storage-icon cses-wenjian"></i>
          <span class="storage-label">云空间</span>
        </div>
        <span class="storage-usage">500GB/500GB</span>
        <div class="storage-progress">
          <div class="storage-progress-fill" style="width: 100%;"></div>
        </div>
        <a class="storage-upgrade" href="#">升级</a>
      </cs-storage-info>
    </div>
  </div>
</div>

</body>
</html>
