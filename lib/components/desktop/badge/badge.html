<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta charset="UTF-8">
  <title>cs-badge 组件预览</title>
  <link rel="stylesheet" href="../../../css/base.css?v=98d0f0e0">
  <link rel="stylesheet" href="../../../fonts/cses-icons.css?v=101">
  <link rel="stylesheet" href="badge.css?v=a197ce0f">
  <style>
    body { padding: 32px; background: #f5f5f5; font-family: "PingFang SC", sans-serif; }
    .section { background: #fff; border-radius: 8px; padding: 24px; margin-bottom: 24px; }
    .section-title { font: var(--typo-cn-16-medium); color: var(--cs-color-text); margin-bottom: 8px; }
    .section-subtitle { font: var(--typo-cn-12-regular); color: var(--cs-color-text-light2); margin-bottom: 16px; }
    .row { display: flex; align-items: center; gap: 32px; flex-wrap: wrap; }
    .row-label { font: var(--typo-cn-12-regular); color: var(--cs-color-text-light2); width: 80px; flex-shrink: 0; }
    .icon-anchor { font-size: 24px; color: var(--cs-color-text); }
  </style>
</head>
<body>

<div class="section">
  <div class="section-title">数字徽章 Count</div>
  <div class="section-subtitle">data-variant="count"（默认）— 角标式数字</div>
  <div class="row">
    <cs-badge>
      <span class="badge-anchor"><i class="cses-tongzhi icon-anchor"></i></span>
      <span class="badge-indicator">5</span>
    </cs-badge>
    <cs-badge>
      <span class="badge-anchor"><i class="cses-tongzhi icon-anchor"></i></span>
      <span class="badge-indicator">12</span>
    </cs-badge>
    <cs-badge>
      <span class="badge-anchor"><i class="cses-tongzhi icon-anchor"></i></span>
      <span class="badge-indicator">99+</span>
    </cs-badge>
  </div>
</div>

<div class="section">
  <div class="section-title">小红点 Dot</div>
  <div class="section-subtitle">data-variant="dot" — 仅提示有更新，不显示数字</div>
  <div class="row">
    <cs-badge data-variant="dot">
      <span class="badge-anchor"><i class="cses-xiaoxi icon-anchor"></i></span>
      <span class="badge-indicator"></span>
    </cs-badge>
    <cs-badge data-variant="dot" data-color="primary">
      <span class="badge-anchor"><i class="cses-xiaoxi icon-anchor"></i></span>
      <span class="badge-indicator"></span>
    </cs-badge>
    <cs-badge data-variant="dot" data-color="success">
      <span class="badge-anchor"><i class="cses-xiaoxi icon-anchor"></i></span>
      <span class="badge-indicator"></span>
    </cs-badge>
  </div>
</div>

<div class="section">
  <div class="section-title">独立徽章 Standalone</div>
  <div class="section-subtitle">data-variant="standalone" — 不挂在元素角上，单独展示</div>
  <div class="row">
    <cs-badge data-variant="standalone" data-color="primary"><span class="badge-indicator">进行中</span></cs-badge>
    <cs-badge data-variant="standalone" data-color="success"><span class="badge-indicator">已完成</span></cs-badge>
    <cs-badge data-variant="standalone" data-color="warning"><span class="badge-indicator">待处理</span></cs-badge>
    <cs-badge data-variant="standalone" data-color="danger"><span class="badge-indicator">已逾期</span></cs-badge>
    <cs-badge data-variant="standalone" data-color="info"><span class="badge-indicator">提示</span></cs-badge>
    <cs-badge data-variant="standalone" data-color="default"><span class="badge-indicator">默认</span></cs-badge>
  </div>
</div>

<div class="section">
  <div class="section-title">尺寸 Sizes</div>
  <div class="section-subtitle">data-size="sm | md | lg"</div>
  <div class="row">
    <span class="row-label">sm</span>
    <cs-badge data-size="sm"><span class="badge-anchor"><i class="cses-tongzhi icon-anchor"></i></span><span class="badge-indicator">3</span></cs-badge>
    <cs-badge data-size="sm" data-variant="dot"><span class="badge-anchor"><i class="cses-tongzhi icon-anchor"></i></span><span class="badge-indicator"></span></cs-badge>
  </div>
  <div class="row" style="margin-top: 16px;">
    <span class="row-label">md</span>
    <cs-badge><span class="badge-anchor"><i class="cses-tongzhi icon-anchor"></i></span><span class="badge-indicator">8</span></cs-badge>
    <cs-badge data-variant="dot"><span class="badge-anchor"><i class="cses-tongzhi icon-anchor"></i></span><span class="badge-indicator"></span></cs-badge>
  </div>
  <div class="row" style="margin-top: 16px;">
    <span class="row-label">lg</span>
    <cs-badge data-size="lg"><span class="badge-anchor"><i class="cses-tongzhi icon-anchor"></i></span><span class="badge-indicator">15</span></cs-badge>
    <cs-badge data-size="lg" data-variant="dot"><span class="badge-anchor"><i class="cses-tongzhi icon-anchor"></i></span><span class="badge-indicator"></span></cs-badge>
  </div>
</div>

</body>
</html>
