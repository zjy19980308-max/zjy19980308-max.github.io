<!-- cs-ai-summary-card · Timeline 视图右侧 AI 复盘评语卡 · 势能徽标 + 叙事文本 + 事件 anchor -->
<cs-ai-summary-card class="cs-ai-summary-card" data-trend="up">
  <header class="cs-ai-summary-card__header">
    <span class="cs-ai-summary-card__brand">
      <i class="cses-aite cs-ai-summary-card__brand-icon"></i>
      AI 复盘
    </span>
    <span class="cs-ai-summary-card__trend cs-ai-summary-card__trend--up">
      <i class="cses-arrow"></i>
      势能向好
    </span>
  </header>
  <div class="cs-ai-summary-card__body">
    <p class="cs-ai-summary-card__lead">
      本季度推进速度同比 <strong class="cs-ai-summary-card__highlight">+23%</strong> · 完成里程碑数较上季度提升 11 个 · 延期数下降 4 个。
    </p>
    <p class="cs-ai-summary-card__para">
      第 5 周达到达成率峰值（92%）· 与 4 月 12 日「融资完成」事件强相关。第 9-11 周延期数小幅反弹 · 主要集中于「平台升级 V2」与「支付集成」两条线 · 建议管理层在下周复盘会聚焦干预。
    </p>
    <ul class="cs-ai-summary-card__anchors" role="list">
      <li class="cs-ai-summary-card__anchor">
        <i class="cses-target-01 cs-ai-summary-card__anchor-icon"></i>
        <span class="cs-ai-summary-card__anchor-label">W16 · 融资完成</span>
        <span class="cs-ai-summary-card__anchor-impact">达成 +18%</span>
      </li>
      <li class="cs-ai-summary-card__anchor">
        <i class="cses-target-01 cs-ai-summary-card__anchor-icon"></i>
        <span class="cs-ai-summary-card__anchor-label">W20 · 团队换帅</span>
        <span class="cs-ai-summary-card__anchor-impact">达成 +9%</span>
      </li>
      <li class="cs-ai-summary-card__anchor">
        <i class="cses-target-01 cs-ai-summary-card__anchor-icon"></i>
        <span class="cs-ai-summary-card__anchor-label">W22 · 重大里程碑</span>
        <span class="cs-ai-summary-card__anchor-impact">峰值 92%</span>
      </li>
    </ul>
  </div>
  <footer class="cs-ai-summary-card__footer">
    <button class="cs-ai-summary-card__action" type="button">
      <i class="cses-refresh"></i>
      重新生成
    </button>
    <button class="cs-ai-summary-card__action cs-ai-summary-card__action--primary" type="button">
      复制到 PPT
    </button>
  </footer>
</cs-ai-summary-card>
