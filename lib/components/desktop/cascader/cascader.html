<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>cs-cascader 组件预览</title>
  <link rel="stylesheet" href="../../../css/base.css">
  <link rel="stylesheet" href="../../../fonts/cses-icons.css?v=101">
  <link rel="stylesheet" href="cascader.css">
  <style>
    body { padding: 32px; background: #f5f5f5; font-family: "PingFang SC", sans-serif; }
    .section { background: #fff; border-radius: 8px; padding: 24px; margin-bottom: 24px; }
    .section-title { font: var(--typo-cn-16-medium); color: var(--cs-color-text); margin-bottom: 8px; }
    .section-subtitle { font: var(--typo-cn-12-regular); color: var(--cs-color-text-light2); margin-bottom: 16px; }
    .row { display: flex; align-items: flex-start; gap: 24px; flex-wrap: wrap; min-height: 360px; }
    .row-label { font: var(--typo-cn-12-regular); color: var(--cs-color-text-light2); width: 96px; flex-shrink: 0; padding-top: 8px; }
    .tip { font: var(--typo-cn-12-regular); color: var(--cs-color-text-light2); margin-top: 8px; padding: 8px 12px; background: #f9f9f9; border-radius: 4px; }
  </style>
</head>
<body>

<!-- 1. 基础三级 -->
<div class="section">
  <div class="section-title">基础用法 Basic</div>
  <div class="section-subtitle">三级级联（省 / 市 / 区），点击叶子节点 → 写入触发器并关闭</div>
  <div class="row">
    <span class="row-label">地区</span>
    <cs-cascader>
      <button class="cascader-trigger" type="button">
        <span class="cascader-trigger-label" data-placeholder>请选择地区</span>
        <i class="cascader-trigger-arrow cses-xiala"></i>
      </button>
      <div class="cascader-panels">
        <div class="cascader-panel">
          <button class="cascader-option" data-active type="button">
            <span class="cascader-option-label">浙江</span>
            <i class="cascader-option-arrow cses-xiala" style="transform: rotate(-90deg);"></i>
          </button>
          <button class="cascader-option" type="button">
            <span class="cascader-option-label">江苏</span>
            <i class="cascader-option-arrow cses-xiala" style="transform: rotate(-90deg);"></i>
          </button>
          <button class="cascader-option" type="button">
            <span class="cascader-option-label">广东</span>
            <i class="cascader-option-arrow cses-xiala" style="transform: rotate(-90deg);"></i>
          </button>
        </div>
        <div class="cascader-panel">
          <button class="cascader-option" data-active type="button">
            <span class="cascader-option-label">杭州</span>
            <i class="cascader-option-arrow cses-xiala" style="transform: rotate(-90deg);"></i>
          </button>
          <button class="cascader-option" type="button">
            <span class="cascader-option-label">宁波</span>
            <i class="cascader-option-arrow cses-xiala" style="transform: rotate(-90deg);"></i>
          </button>
          <button class="cascader-option" type="button">
            <span class="cascader-option-label">温州</span>
            <i class="cascader-option-arrow cses-xiala" style="transform: rotate(-90deg);"></i>
          </button>
        </div>
        <div class="cascader-panel">
          <button class="cascader-option" type="button">
            <span class="cascader-option-label">西湖区</span>
          </button>
          <button class="cascader-option" type="button">
            <span class="cascader-option-label">滨江区</span>
          </button>
          <button class="cascader-option" type="button">
            <span class="cascader-option-label">余杭区</span>
          </button>
          <button class="cascader-option" data-disabled type="button">
            <span class="cascader-option-label">萧山区（禁用）</span>
          </button>
        </div>
      </div>
    </cs-cascader>
  </div>
  <div class="tip">交互验证：① 点击触发器 → 弹出三列 ② 点击叶子选项 → 触发器显示 "浙江 / 杭州 / 西湖区" ③ ESC / 点外部 → 收起</div>
</div>

<!-- 2. 已选回填 -->
<div class="section">
  <div class="section-title">已选回填 With Value</div>
  <div class="section-subtitle">触发器 label 显示选中路径</div>
  <div class="row" style="min-height: 80px;">
    <cs-cascader>
      <button class="cascader-trigger" type="button">
        <span class="cascader-trigger-label">浙江 / 杭州 / 西湖区</span>
        <i class="cascader-trigger-arrow cses-xiala"></i>
      </button>
      <div class="cascader-panels">
        <div class="cascader-panel">
          <button class="cascader-option" data-active type="button">
            <span class="cascader-option-label">浙江</span>
            <i class="cascader-option-arrow cses-xiala" style="transform: rotate(-90deg);"></i>
          </button>
        </div>
      </div>
    </cs-cascader>
  </div>
</div>

<!-- 3. 尺寸变体 -->
<div class="section">
  <div class="section-title">尺寸变体 Sizes</div>
  <div class="row" style="min-height: 80px;">
    <cs-cascader data-size="sm">
      <button class="cascader-trigger" type="button">
        <span class="cascader-trigger-label" data-placeholder>小尺寸</span>
        <i class="cascader-trigger-arrow cses-xiala"></i>
      </button>
      <div class="cascader-panels"><div class="cascader-panel"><button class="cascader-option" type="button"><span class="cascader-option-label">选项</span></button></div></div>
    </cs-cascader>
    <cs-cascader>
      <button class="cascader-trigger" type="button">
        <span class="cascader-trigger-label" data-placeholder>中尺寸</span>
        <i class="cascader-trigger-arrow cses-xiala"></i>
      </button>
      <div class="cascader-panels"><div class="cascader-panel"><button class="cascader-option" type="button"><span class="cascader-option-label">选项</span></button></div></div>
    </cs-cascader>
    <cs-cascader data-size="lg">
      <button class="cascader-trigger" type="button">
        <span class="cascader-trigger-label" data-placeholder>大尺寸</span>
        <i class="cascader-trigger-arrow cses-xiala"></i>
      </button>
      <div class="cascader-panels"><div class="cascader-panel"><button class="cascader-option" type="button"><span class="cascader-option-label">选项</span></button></div></div>
    </cs-cascader>
  </div>
</div>

<!-- 4. 禁用 -->
<div class="section">
  <div class="section-title">禁用态 Disabled</div>
  <div class="row" style="min-height: 80px;">
    <cs-cascader data-disabled>
      <button class="cascader-trigger" type="button">
        <span class="cascader-trigger-label" data-placeholder>禁用</span>
        <i class="cascader-trigger-arrow cses-xiala"></i>
      </button>
      <div class="cascader-panels"><div class="cascader-panel"><button class="cascader-option" type="button"><span class="cascader-option-label">选项</span></button></div></div>
    </cs-cascader>
  </div>
</div>

<script src="cascader.js"></script>
</body>
</html>
