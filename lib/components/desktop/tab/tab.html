<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta charset="UTF-8">
  <title>cs-tab 组件预览</title>
  <link rel="stylesheet" href="../../../css/base.css?v=98d0f0e0">
  <link rel="stylesheet" href="../../../fonts/cses-icons.css?v=101">
  <link rel="stylesheet" href="tab.css?v=82985049">
  <style>
    body { padding: 32px; background: #f5f5f5; }
    .section { background: #fff; border-radius: 8px; padding: 24px; margin-bottom: 24px; }
    .section-title { font: var(--typo-cn-16-medium); color: var(--cs-color-text); margin-bottom: 16px; }
    .section-subtitle { font: var(--typo-cn-12-regular); color: var(--cs-color-text-light2); margin-bottom: 16px; }
    .row { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
    .row-label { font: var(--typo-cn-12-regular); color: var(--cs-color-text-light2); width: 80px; flex-shrink: 0; }
    .dark-bg { background: var(--cs-color-bg-app-dark); padding: 16px; border-radius: 8px; display: flex; align-items: center; gap: 4px; }
  </style>
</head>
<body>

<!-- 基础状态 -->
<div class="section">
  <div class="section-title">标签页 Tab</div>
  <div class="section-subtitle">用于顶部 tabbar 的标签项，深色背景场景。13px 字体，激活态带背景和常显关闭按钮</div>

  <div class="row">
    <span class="row-label">默认态</span>
    <div class="dark-bg">
      <cs-tab>
        <span class="tab-label">文档</span>
        <i class="tab-close cses-guanbi"></i>
      </cs-tab>
    </div>
  </div>

  <div class="row">
    <span class="row-label">激活态</span>
    <div class="dark-bg">
      <cs-tab data-active>
        <span class="tab-label">文档</span>
        <i class="tab-close cses-guanbi"></i>
      </cs-tab>
    </div>
  </div>

  <div class="row">
    <span class="row-label">带图标</span>
    <div class="dark-bg">
      <cs-tab>
        <i class="tab-icon cses-wendang"></i>
        <span class="tab-label">文档库</span>
        <i class="tab-close cses-guanbi"></i>
      </cs-tab>
      <cs-tab data-active>
        <i class="tab-icon cses-renwu"></i>
        <span class="tab-label">任务</span>
        <i class="tab-close cses-guanbi"></i>
      </cs-tab>
    </div>
  </div>

  <div class="row">
    <span class="row-label">组合展示</span>
    <div class="dark-bg">
      <cs-tab data-active>
        <i class="tab-icon cses-wendang"></i>
        <span class="tab-label">文档库</span>
        <i class="tab-close cses-guanbi"></i>
      </cs-tab>
      <cs-tab>
        <i class="tab-icon cses-renwu"></i>
        <span class="tab-label">任务</span>
        <i class="tab-close cses-guanbi"></i>
      </cs-tab>
      <cs-tab>
        <span class="tab-label">日程</span>
        <i class="tab-close cses-guanbi"></i>
      </cs-tab>
    </div>
  </div>
</div>

</body>
</html>
