<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>cs-app-icon 企业应用图标</title>
  <link rel="stylesheet" href="../../../css/base.css">
  <link rel="stylesheet" href="../../../fonts/cses-icons.css?v=101">
  <link rel="stylesheet" href="app-icon.css">
  <style>
    body { padding: 32px; background: var(--cs-color-bg-light); }
    .demo-section { margin-bottom: 32px; }
    .demo-label { font: var(--typo-cn-12-medium); color: var(--cs-color-text-light2); margin-bottom: 12px; }
    .demo-row { display: flex; gap: 24px; flex-wrap: wrap; }
  </style>
</head>
<body>

<div class="demo-section">
  <div class="demo-label">企业应用图标（业务系统）</div>
  <div class="demo-row">
    <cs-app-icon data-color="blue">
      <span class="app-icon-box"><i class="cses-gouxuan_xuanzhong"></i></span>
      <span class="app-icon-label">审批系统</span>
    </cs-app-icon>
    <cs-app-icon data-color="orange">
      <span class="app-icon-box"><i class="cses-alert"></i></span>
      <span class="app-icon-label">风险管理</span>
    </cs-app-icon>
    <cs-app-icon data-color="green">
      <span class="app-icon-box"><i class="cses-aite"></i></span>
      <span class="app-icon-label">CRM</span>
    </cs-app-icon>
    <cs-app-icon data-color="purple">
      <span class="app-icon-box"><i class="cses-renwuguanli"></i></span>
      <span class="app-icon-label">数据资产</span>
    </cs-app-icon>
    <cs-app-icon data-color="sky">
      <span class="app-icon-box"><i class="cses-shezhi"></i></span>
      <span class="app-icon-label">阿拉丁</span>
    </cs-app-icon>
  </div>
</div>

<div class="demo-section">
  <div class="demo-label">更多颜色变体</div>
  <div class="demo-row">
    <cs-app-icon data-color="red">
      <span class="app-icon-box"><i class="cses-xiaoxi"></i></span>
      <span class="app-icon-label">管会系统</span>
    </cs-app-icon>
    <cs-app-icon data-color="pink">
      <span class="app-icon-box"><i class="cses-shezhi"></i></span>
      <span class="app-icon-label">智能营销</span>
    </cs-app-icon>
    <cs-app-icon data-color="cyan">
      <span class="app-icon-box"><i class="cses-sousuo"></i></span>
      <span class="app-icon-label">天眼</span>
    </cs-app-icon>
  </div>
</div>

</body>
</html>
