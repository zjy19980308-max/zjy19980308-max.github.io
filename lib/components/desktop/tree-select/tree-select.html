<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>cs-tree-select 组件预览</title>
  <link rel="stylesheet" href="../../../css/base.css">
  <link rel="stylesheet" href="../../../fonts/cses-icons.css?v=101">
  <link rel="stylesheet" href="tree-select.css">
  <style>
    body { padding: 32px; background: #f5f5f5; font-family: "PingFang SC", sans-serif; }
    .section { background: #fff; border-radius: 8px; padding: 24px; margin-bottom: 24px; }
    .section-title { font: var(--typo-cn-16-medium); color: var(--cs-color-text); margin-bottom: 8px; }
    .section-subtitle { font: var(--typo-cn-12-regular); color: var(--cs-color-text-light2); margin-bottom: 16px; }
    .row { display: flex; align-items: flex-start; gap: 24px; flex-wrap: wrap; min-height: 400px; }
    .row-label { font: var(--typo-cn-12-regular); color: var(--cs-color-text-light2); width: 96px; flex-shrink: 0; padding-top: 8px; }
    .tip { font: var(--typo-cn-12-regular); color: var(--cs-color-text-light2); margin-top: 8px; padding: 8px 12px; background: #f9f9f9; border-radius: 4px; }
  </style>
</head>
<body>

<!-- 1. 基础树 -->
<div class="section">
  <div class="section-title">基础用法 Basic</div>
  <div class="section-subtitle">点击触发器 → 弹出树面板，点击节点选中，点击 ▶ 折叠/展开</div>
  <div class="row">
    <span class="row-label">部门</span>
    <cs-tree-select>
      <button class="ts-trigger" type="button">
        <span class="ts-trigger-label" data-placeholder>请选择部门</span>
        <i class="ts-trigger-arrow cses-xiala"></i>
      </button>
      <div class="ts-panel">
        <ul class="ts-tree">
          <li class="ts-node" data-expanded>
            <div class="ts-node-row">
              <button class="ts-node-toggle" type="button"><i class="cses-xiala" style="transform: rotate(-90deg);"></i></button>
              <i class="ts-node-icon cses-wenjian"></i>
              <span class="ts-node-label">技术中心</span>
            </div>
            <ul class="ts-children">
              <li class="ts-node" data-expanded>
                <div class="ts-node-row">
                  <button class="ts-node-toggle" type="button"><i class="cses-xiala" style="transform: rotate(-90deg);"></i></button>
                  <i class="ts-node-icon cses-wenjian"></i>
                  <span class="ts-node-label">前端组</span>
                </div>
                <ul class="ts-children">
                  <li class="ts-node" data-active>
                    <div class="ts-node-row">
                      <button class="ts-node-toggle" data-leaf type="button"></button>
                      <i class="ts-node-icon cses-renyuan"></i>
                      <span class="ts-node-label">Web 应用组</span>
                    </div>
                  </li>
                  <li class="ts-node">
                    <div class="ts-node-row">
                      <button class="ts-node-toggle" data-leaf type="button"></button>
                      <i class="ts-node-icon cses-renyuan"></i>
                      <span class="ts-node-label">移动端组</span>
                    </div>
                  </li>
                </ul>
              </li>
              <li class="ts-node">
                <div class="ts-node-row">
                  <button class="ts-node-toggle" type="button"><i class="cses-xiala" style="transform: rotate(-90deg);"></i></button>
                  <i class="ts-node-icon cses-wenjian"></i>
                  <span class="ts-node-label">后端组</span>
                </div>
                <ul class="ts-children">
                  <li class="ts-node">
                    <div class="ts-node-row">
                      <button class="ts-node-toggle" data-leaf type="button"></button>
                      <i class="ts-node-icon cses-renyuan"></i>
                      <span class="ts-node-label">基础架构</span>
                    </div>
                  </li>
                </ul>
              </li>
            </ul>
          </li>
          <li class="ts-node">
            <div class="ts-node-row">
              <button class="ts-node-toggle" type="button"><i class="cses-xiala" style="transform: rotate(-90deg);"></i></button>
              <i class="ts-node-icon cses-wenjian"></i>
              <span class="ts-node-label">设计中心</span>
            </div>
            <ul class="ts-children">
              <li class="ts-node">
                <div class="ts-node-row">
                  <button class="ts-node-toggle" data-leaf type="button"></button>
                  <i class="ts-node-icon cses-renyuan"></i>
                  <span class="ts-node-label">UX 组</span>
                </div>
              </li>
            </ul>
          </li>
          <li class="ts-node" data-disabled>
            <div class="ts-node-row">
              <button class="ts-node-toggle" data-leaf type="button"></button>
              <i class="ts-node-icon cses-wenjian"></i>
              <span class="ts-node-label">财务部（禁用）</span>
            </div>
          </li>
        </ul>
      </div>
    </cs-tree-select>
  </div>
  <div class="tip">交互验证：① 点击展开 ② 点击 ▶ 折叠子树 ③ 点击叶子 → 写入触发器并关闭</div>
</div>

<!-- 2. 尺寸 + 禁用 -->
<div class="section">
  <div class="section-title">尺寸变体 / 禁用 Sizes & Disabled</div>
  <div class="row" style="min-height: 80px;">
    <cs-tree-select data-size="sm">
      <button class="ts-trigger" type="button">
        <span class="ts-trigger-label" data-placeholder>小尺寸</span>
        <i class="ts-trigger-arrow cses-xiala"></i>
      </button>
      <div class="ts-panel"><ul class="ts-tree"><li class="ts-node"><div class="ts-node-row"><button class="ts-node-toggle" data-leaf type="button"></button><span class="ts-node-label">节点</span></div></li></ul></div>
    </cs-tree-select>
    <cs-tree-select>
      <button class="ts-trigger" type="button">
        <span class="ts-trigger-label">已选：Web 应用组</span>
        <i class="ts-trigger-arrow cses-xiala"></i>
      </button>
      <div class="ts-panel"><ul class="ts-tree"><li class="ts-node"><div class="ts-node-row"><button class="ts-node-toggle" data-leaf type="button"></button><span class="ts-node-label">节点</span></div></li></ul></div>
    </cs-tree-select>
    <cs-tree-select data-size="lg">
      <button class="ts-trigger" type="button">
        <span class="ts-trigger-label" data-placeholder>大尺寸</span>
        <i class="ts-trigger-arrow cses-xiala"></i>
      </button>
      <div class="ts-panel"><ul class="ts-tree"><li class="ts-node"><div class="ts-node-row"><button class="ts-node-toggle" data-leaf type="button"></button><span class="ts-node-label">节点</span></div></li></ul></div>
    </cs-tree-select>
    <cs-tree-select data-disabled>
      <button class="ts-trigger" type="button">
        <span class="ts-trigger-label" data-placeholder>禁用</span>
        <i class="ts-trigger-arrow cses-xiala"></i>
      </button>
      <div class="ts-panel"></div>
    </cs-tree-select>
  </div>
</div>

<script src="tree-select.js"></script>
</body>
</html>
