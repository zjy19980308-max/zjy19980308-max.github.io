<!-- task_id: 学员看板（老师版）-2026-05-21-1430 · component: cs-kpi-row · PLAN-003 ★ -->
<section class="cs-kpi-row" data-component="cs-kpi-row" aria-label="班级关键指标">
  <article class="cs-kpi-card" data-trend="up">
    <header class="cs-kpi-card__head">
      <span class="cs-kpi-card__label">在学人数</span>
      <i class="cses-renyuan cs-kpi-card__icon" aria-hidden="true"></i>
    </header>
    <div class="cs-kpi-card__value">
      <span class="cs-kpi-card__num">48</span>
      <span class="cs-kpi-card__unit">人</span>
    </div>
    <footer class="cs-kpi-card__foot">
      <span class="cs-delta cs-delta--up" aria-label="周环比 +2">
        <i class="cses-paixushang" aria-hidden="true"></i>
        <span>+2</span>
      </span>
      <span class="cs-kpi-card__compare">周环比</span>
    </footer>
  </article>

  <article class="cs-kpi-card" data-trend="up">
    <header class="cs-kpi-card__head">
      <span class="cs-kpi-card__label">完成人数</span>
      <i class="cses-check-circle cs-kpi-card__icon" aria-hidden="true"></i>
    </header>
    <div class="cs-kpi-card__value">
      <span class="cs-kpi-card__num">31</span>
      <span class="cs-kpi-card__unit">人</span>
      <span class="cs-kpi-card__rate">64.6%</span>
    </div>
    <footer class="cs-kpi-card__foot">
      <span class="cs-delta cs-delta--up">
        <i class="cses-paixushang" aria-hidden="true"></i>
        <span>+12%</span>
      </span>
      <span class="cs-kpi-card__compare">完成率</span>
    </footer>
  </article>

  <article class="cs-kpi-card cs-kpi-card--warning" data-trend="up-bad">
    <header class="cs-kpi-card__head">
      <span class="cs-kpi-card__label">卡壳人数</span>
      <i class="cses-alert cs-kpi-card__icon" aria-hidden="true"></i>
    </header>
    <div class="cs-kpi-card__value">
      <span class="cs-kpi-card__num">7</span>
      <span class="cs-kpi-card__unit">人</span>
      <span class="cs-status-pill cs-status-pill--danger">需关注</span>
    </div>
    <footer class="cs-kpi-card__foot">
      <span class="cs-delta cs-delta--up cs-delta--bad">
        <i class="cses-paixushang" aria-hidden="true"></i>
        <span>+3</span>
      </span>
      <span class="cs-kpi-card__compare">较上周</span>
    </footer>
  </article>

  <article class="cs-kpi-card" data-trend="down">
    <header class="cs-kpi-card__head">
      <span class="cs-kpi-card__label">未活跃 7+ 天</span>
      <i class="cses-diannao cs-kpi-card__icon" aria-hidden="true"></i>
    </header>
    <div class="cs-kpi-card__value">
      <span class="cs-kpi-card__num">4</span>
      <span class="cs-kpi-card__unit">人</span>
    </div>
    <footer class="cs-kpi-card__foot cs-kpi-card__foot--chart">
      <span class="cs-kpi-card__spark cs-kpi-card__spark--down" aria-hidden="true">
        <span class="cs-kpi-card__spark-dot" style="--cs-spark-x:0%;--cs-spark-y:75%"></span>
        <span class="cs-kpi-card__spark-dot" style="--cs-spark-x:14%;--cs-spark-y:50%"></span>
        <span class="cs-kpi-card__spark-dot" style="--cs-spark-x:28%;--cs-spark-y:66%"></span>
        <span class="cs-kpi-card__spark-dot" style="--cs-spark-x:42%;--cs-spark-y:33%"></span>
        <span class="cs-kpi-card__spark-dot" style="--cs-spark-x:56%;--cs-spark-y:50%"></span>
        <span class="cs-kpi-card__spark-dot" style="--cs-spark-x:70%;--cs-spark-y:25%"></span>
        <span class="cs-kpi-card__spark-dot" style="--cs-spark-x:84%;--cs-spark-y:42%"></span>
        <span class="cs-kpi-card__spark-dot" style="--cs-spark-x:100%;--cs-spark-y:16%"></span>
      </span>
      <span class="cs-delta cs-delta--down">
        <i class="cses-paixuxia" aria-hidden="true"></i>
        <span>-1</span>
      </span>
    </footer>
  </article>
</section>
