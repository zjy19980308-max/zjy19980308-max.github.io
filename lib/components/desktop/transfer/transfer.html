<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>cs-transfer 组件预览</title>
  <link rel="stylesheet" href="../../../css/base.css">
  <link rel="stylesheet" href="../../../fonts/cses-icons.css?v=101">
  <link rel="stylesheet" href="transfer.css">
  <style>
    body { padding: 32px; background: #f5f5f5; font-family: "PingFang SC", sans-serif; }
    .section { background: #fff; border-radius: 8px; padding: 24px; margin-bottom: 24px; }
    .section-title { font: var(--typo-cn-16-medium); color: var(--cs-color-text); margin-bottom: 8px; }
    .section-subtitle { font: var(--typo-cn-12-regular); color: var(--cs-color-text-light2); margin-bottom: 16px; }
    .row { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 16px; }
  </style>
</head>
<body>

<!-- ========== 1. 基础 ========== -->
<div class="section">
  <div class="section-title">基础穿梭框 Basic</div>
  <div class="section-subtitle">左侧源列表 → 右侧已选列表，静态演示（点击无真实效果）</div>
  <div class="row">
    <cs-transfer>
      <div class="transfer-list">
        <div class="transfer-list-header">
          <span class="transfer-list-title" data-count="6 项">候选</span>
        </div>
        <div class="transfer-list-body">
          <label class="transfer-item"><input type="checkbox"><span class="transfer-item-label">张三</span></label>
          <label class="transfer-item" data-checked><input type="checkbox" checked><span class="transfer-item-label">李四</span></label>
          <label class="transfer-item" data-checked><input type="checkbox" checked><span class="transfer-item-label">王五</span></label>
          <label class="transfer-item"><input type="checkbox"><span class="transfer-item-label">赵六</span></label>
          <label class="transfer-item"><input type="checkbox"><span class="transfer-item-label">孙七</span></label>
          <label class="transfer-item" data-disabled><input type="checkbox" disabled><span class="transfer-item-label">周八（不可选）</span></label>
        </div>
        <div class="transfer-list-footer">共 6 人</div>
      </div>

      <div class="transfer-operations">
        <button class="transfer-operation-btn" type="button" aria-label="向右移动"><i class="cses-qianjin"></i></button>
        <button class="transfer-operation-btn" type="button" data-disabled aria-label="向左移动"><i class="cses-houtui"></i></button>
      </div>

      <div class="transfer-list">
        <div class="transfer-list-header">
          <span class="transfer-list-title" data-count="2 项">已选</span>
        </div>
        <div class="transfer-list-body">
          <label class="transfer-item"><input type="checkbox"><span class="transfer-item-label">Alice</span></label>
          <label class="transfer-item"><input type="checkbox"><span class="transfer-item-label">Bob</span></label>
        </div>
        <div class="transfer-list-footer">共 2 人</div>
      </div>
    </cs-transfer>
  </div>
</div>

<!-- ========== 2. 禁用 ========== -->
<div class="section">
  <div class="section-title">禁用 Disabled</div>
  <div class="section-subtitle">data-disabled 整体半透明不可交互</div>
  <div class="row">
    <cs-transfer data-disabled>
      <div class="transfer-list">
        <div class="transfer-list-header">
          <span class="transfer-list-title" data-count="3 项">候选</span>
        </div>
        <div class="transfer-list-body">
          <label class="transfer-item"><input type="checkbox"><span class="transfer-item-label">项目 A</span></label>
          <label class="transfer-item"><input type="checkbox"><span class="transfer-item-label">项目 B</span></label>
          <label class="transfer-item"><input type="checkbox"><span class="transfer-item-label">项目 C</span></label>
        </div>
      </div>

      <div class="transfer-operations">
        <button class="transfer-operation-btn" type="button" data-disabled><i class="cses-qianjin"></i></button>
        <button class="transfer-operation-btn" type="button" data-disabled><i class="cses-houtui"></i></button>
      </div>

      <div class="transfer-list">
        <div class="transfer-list-header">
          <span class="transfer-list-title" data-count="0 项">已选</span>
        </div>
        <div class="transfer-list-body"></div>
      </div>
    </cs-transfer>
  </div>
</div>

</body>
</html>
