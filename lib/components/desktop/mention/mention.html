<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>cs-mention 组件预览</title>
  <link rel="stylesheet" href="../../../css/base.css">
  <link rel="stylesheet" href="../../../fonts/cses-icons.css?v=101">
  <link rel="stylesheet" href="mention.css">
  <style>
    body { padding: 32px; background: #f5f5f5; font-family: "PingFang SC", sans-serif; }
    .section { background: #fff; border-radius: 8px; padding: 24px; margin-bottom: 24px; }
    .section-title { font: var(--typo-cn-16-medium); color: var(--cs-color-text); margin-bottom: 8px; }
    .section-subtitle { font: var(--typo-cn-12-regular); color: var(--cs-color-text-light2); margin-bottom: 16px; }
    .row { display: flex; align-items: flex-start; gap: 24px; flex-wrap: wrap; min-height: 280px; }
    .row-label { font: var(--typo-cn-12-regular); color: var(--cs-color-text-light2); width: 96px; flex-shrink: 0; padding-top: 8px; }
    .tip { font: var(--typo-cn-12-regular); color: var(--cs-color-text-light2); margin-top: 8px; padding: 8px 12px; background: #f9f9f9; border-radius: 4px; }
  </style>
</head>
<body>

<!-- 1. 基础用法 -->
<div class="section">
  <div class="section-title">基础用法 Basic</div>
  <div class="section-subtitle">输入框 focus → 弹出候选列表，点击候选 → 填入并关闭</div>
  <div class="row">
    <span class="row-label">@用户</span>
    <cs-mention>
      <input class="mention-input" type="text" placeholder="输入 @ 提及他人">
      <div class="mention-dropdown">
        <button class="mention-option" type="button">
          <span class="mention-option-avatar">张</span>
          <span class="mention-option-label">张三</span>
          <span class="mention-option-meta">产品经理</span>
        </button>
        <button class="mention-option" data-active type="button">
          <span class="mention-option-avatar">李</span>
          <span class="mention-option-label">李四</span>
          <span class="mention-option-meta">设计师</span>
        </button>
        <button class="mention-option" type="button">
          <span class="mention-option-avatar">王</span>
          <span class="mention-option-label">王五</span>
          <span class="mention-option-meta">前端工程师</span>
        </button>
        <button class="mention-option" type="button">
          <span class="mention-option-avatar">赵</span>
          <span class="mention-option-label">赵六</span>
          <span class="mention-option-meta">QA</span>
        </button>
      </div>
    </cs-mention>
  </div>
  <div class="tip">交互验证：① 点击输入框 → 弹出候选 ② 点击候选 → 填入 @用户名 ③ 点击外部 → 收起 ④ ESC → 收起</div>
</div>

<!-- 2. 尺寸变体 -->
<div class="section">
  <div class="section-title">尺寸变体 Sizes</div>
  <div class="section-subtitle">data-size="sm | md | lg"</div>
  <div class="row">
    <span class="row-label">三档</span>
    <cs-mention data-size="sm">
      <input class="mention-input" type="text" placeholder="小尺寸">
      <div class="mention-dropdown">
        <button class="mention-option" type="button">
          <span class="mention-option-avatar">张</span>
          <span class="mention-option-label">张三</span>
        </button>
      </div>
    </cs-mention>
    <cs-mention>
      <input class="mention-input" type="text" placeholder="中尺寸（默认）">
      <div class="mention-dropdown">
        <button class="mention-option" type="button">
          <span class="mention-option-avatar">张</span>
          <span class="mention-option-label">张三</span>
        </button>
      </div>
    </cs-mention>
    <cs-mention data-size="lg">
      <input class="mention-input" type="text" placeholder="大尺寸">
      <div class="mention-dropdown">
        <button class="mention-option" type="button">
          <span class="mention-option-avatar">张</span>
          <span class="mention-option-label">张三</span>
        </button>
      </div>
    </cs-mention>
  </div>
</div>

<!-- 3. 空态 -->
<div class="section">
  <div class="section-title">空态 Empty</div>
  <div class="section-subtitle">候选列表无数据时</div>
  <div class="row">
    <cs-mention>
      <input class="mention-input" type="text" placeholder="无候选">
      <div class="mention-dropdown">
        <span class="mention-empty">暂无匹配项</span>
      </div>
    </cs-mention>
  </div>
</div>

<!-- 4. 禁用 -->
<div class="section">
  <div class="section-title">禁用态 Disabled</div>
  <div class="row" style="min-height: 80px;">
    <cs-mention data-disabled>
      <input class="mention-input" type="text" placeholder="禁用">
      <div class="mention-dropdown">
        <button class="mention-option" type="button">
          <span class="mention-option-avatar">张</span>
          <span class="mention-option-label">张三</span>
        </button>
      </div>
    </cs-mention>
  </div>
</div>

<script src="mention.js"></script>
</body>
</html>
