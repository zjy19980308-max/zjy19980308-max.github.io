<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>cs-section-header preview</title>
  <link rel="stylesheet" href="../../../../css/base.css">
  <link rel="stylesheet" href="../../../../fonts/cses-icons.css">
  <link rel="stylesheet" href="../../../css/workspace.css">
  <link rel="stylesheet" href="section-header.css">
  <style>body{padding:24px;background:#fff;font-family:PingFang SC;display:flex;flex-direction:column;gap:16px;}</style>
</head>
<body>
  <cs-section-header data-color="primary">
    <span class="sh-left"><span class="sh-bar"></span><span class="sh-title">智能待办</span><span class="sh-count">(8)</span></span>
    <a class="sh-right">全部 <i class="cses-right"></i></a>
  </cs-section-header>
  <cs-section-header data-color="warning">
    <span class="sh-left"><span class="sh-bar"></span><span class="sh-title">协同动态</span></span>
    <a class="sh-right">查看全部 <i class="cses-right"></i></a>
  </cs-section-header>
  <cs-section-header data-color="cyan">
    <span class="sh-left"><span class="sh-bar"></span><span class="sh-title">最近文档</span></span>
    <a class="sh-right">+ 创建文档</a>
  </cs-section-header>
</body>
</html>
