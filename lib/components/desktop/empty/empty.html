<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta charset="UTF-8">
  <title>cs-empty 组件预览</title>
  <link rel="stylesheet" href="../../../css/base.css?v=98d0f0e0">
  <link rel="stylesheet" href="../../../fonts/cses-icons.css?v=101">
  <link rel="stylesheet" href="../button/button.css?v=e453e8e3">
  <link rel="stylesheet" href="empty.css?v=9538e0d7">
  <style>
    body { padding: 32px; background: #f5f5f5; font-family: "PingFang SC", sans-serif; }
    .section { background: #fff; border-radius: 8px; padding: 24px; margin-bottom: 24px; }
    .section-title { font: var(--typo-cn-16-medium); color: var(--cs-color-text); margin-bottom: 8px; }
    .section-subtitle { font: var(--typo-cn-12-regular); color: var(--cs-color-text-light2); margin-bottom: 16px; }
    .demo-stage { background: #fafafa; border-radius: 4px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  </style>
</head>
<body>

<!-- ========== 1. 默认 ========== -->
<div class="section">
  <div class="section-title">默认 Default</div>
  <div class="section-subtitle">基础空状态</div>
  <div class="demo-stage">
    <cs-empty>
      <i class="empty-image cses-wendangku"></i>
      <div class="empty-description">暂无数据</div>
    </cs-empty>
  </div>
</div>

<!-- ========== 2. 带操作 ========== -->
<div class="section">
  <div class="section-title">带操作 With Action</div>
  <div class="section-subtitle">.empty-extra 内放按钮引导用户下一步</div>
  <div class="demo-stage">
    <cs-empty>
      <i class="empty-image cses-wendangku"></i>
      <div class="empty-description">您还没有任何文档，点击下方按钮开始创建吧</div>
      <div class="empty-extra">
        <cs-button data-variant="primary"><span class="btn-text">立即创建</span></cs-button>
        <cs-button data-variant="secondary"><span class="btn-text">导入模板</span></cs-button>
      </div>
    </cs-empty>
  </div>
</div>

<!-- ========== 3. 三种尺寸 ========== -->
<div class="section">
  <div class="section-title">三种尺寸 Sizes</div>
  <div class="section-subtitle">data-size="sm | md | lg"</div>
  <div class="grid-3">
    <div class="demo-stage">
      <cs-empty data-size="sm">
        <i class="empty-image cses-wendangku"></i>
        <div class="empty-description">小尺寸·列表内</div>
      </cs-empty>
    </div>
    <div class="demo-stage">
      <cs-empty>
        <i class="empty-image cses-wendangku"></i>
        <div class="empty-description">中尺寸·卡片内</div>
      </cs-empty>
    </div>
    <div class="demo-stage">
      <cs-empty data-size="lg">
        <i class="empty-image cses-wendangku"></i>
        <div class="empty-description">大尺寸·整页</div>
      </cs-empty>
    </div>
  </div>
</div>

<!-- ========== 4. 不同语义图标 ========== -->
<div class="section">
  <div class="section-title">不同图标 Different Icons</div>
  <div class="section-subtitle">用业务相关图标增强情境</div>
  <div class="grid-3">
    <div class="demo-stage">
      <cs-empty>
        <i class="empty-image cses-search"></i>
        <div class="empty-description">未找到匹配结果</div>
      </cs-empty>
    </div>
    <div class="demo-stage">
      <cs-empty>
        <i class="empty-image cses-xiaoxi"></i>
        <div class="empty-description">暂无新消息</div>
      </cs-empty>
    </div>
    <div class="demo-stage">
      <cs-empty>
        <i class="empty-image cses-rili"></i>
        <div class="empty-description">今日无日程安排</div>
      </cs-empty>
    </div>
  </div>
</div>

</body>
</html>
