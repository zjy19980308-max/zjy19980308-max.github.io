<!-- doc-block demo · 文档内容块（卡片缩略与编辑器共用）
     引：../../../css/{token,variable,base}.css + ../../../fonts/cses-icons.css + doc-block.css -->
<div class="dk dk-pad" style="width:234px; background:var(--cs-color-white);">

  <p class="dk-h1">一、标题缩略 H1</p>
  <p class="dk-h2">二、副标题 H2</p>
  <p class="dk-text">正文段落（弱）。</p>
  <p class="dk-text is-strong">正文段落（强）。</p>

  <ul class="dk-list">
    <li>无序列表项一</li>
    <li>无序列表项二</li>
  </ul>
  <ol class="dk-list is-ordered">
    <li>有序列表项一</li>
    <li>有序列表项二</li>
  </ol>

  <div class="dk-outline">
    <div class="dk-outline-row lv1">1. 一级</div>
    <div class="dk-outline-row lv2">1.1 二级</div>
    <div class="dk-outline-row lv3">1.1.1 三级</div>
  </div>

  <table class="dk-table">
    <tr><th>列</th><th>Q2</th><th>Q3</th></tr>
    <tr><td>行</td><td class="is-num">1.2M</td><td class="is-num">1.8M</td></tr>
  </table>

  <div class="dk-code">
    <span class="dk-code-line c1"></span>
    <span class="dk-code-line c4"></span>
    <span class="dk-code-line c2"></span>
  </div>

  <div class="dk-callout"><i class="cses-info-circle"></i><span>主色 callout。</span></div>
  <div class="dk-callout is-warn"><i class="cses-info-circle"></i><span>警告 callout。</span></div>

  <hr class="dk-divider">

  <div class="dk-tags">
    <span class="dk-tag is-brand">品牌</span>
    <span class="dk-tag">普通</span>
  </div>

  <div class="dk-stat">
    <div class="dk-stat-row"><span>进度</span><span>80%</span></div>
    <div class="dk-stat-track"><div class="dk-stat-fill is-success" style="width:80%;"></div></div>
  </div>
</div>
