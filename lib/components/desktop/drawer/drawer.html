<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>cs-drawer 组件预览</title>
<link rel="stylesheet" href="../../../css/token.css">
<link rel="stylesheet" href="../../../css/variable.css">
<link rel="stylesheet" href="../../../css/base.css">
<link rel="stylesheet" href="../../../fonts/cses-icons.css">
<link rel="stylesheet" href="../button/button.css">
<link rel="stylesheet" href="../tag/tag.css">
<link rel="stylesheet" href="../descriptions/descriptions.css">
<link rel="stylesheet" href="drawer.css">
<script src="drawer.js" defer></script>
<style>body{ font-family:"PingFang SC",sans-serif; padding:40px; background:var(--cs-color-bg-light); }</style>
</head>
<body>
  <cs-button data-drawer-open="demoDrawer"><span class="btn-label">打开抽屉</span></cs-button>

  <cs-drawer id="demoDrawer">
    <div class="drawer-panel">
      <header class="drawer-head">
        <span class="drawer-close" data-drawer-close><i class="cses-guanbi"></i></span>
        <div class="drawer-profile">
          <div class="drawer-profile-ava"><img src="https://i.pravatar.cc/160?img=5" alt=""></div>
          <div class="drawer-profile-main">
            <h2 class="drawer-title">张静远</h2>
            <div class="drawer-meta">
              <cs-tag data-color="success"><span class="tag-label">在职</span></cs-tag>
              <span class="drawer-meta-sep"></span><span>设计部</span>
              <span class="drawer-meta-sep"></span><span>正式</span>
            </div>
            <div class="drawer-actions">
              <cs-button data-variant="secondary"><span class="btn-label">发起调动</span></cs-button>
              <cs-button data-variant="secondary"><span class="btn-label">办理离职</span></cs-button>
            </div>
          </div>
        </div>
        <div class="drawer-tabs">
          <span class="drawer-tab is-active">基本信息</span>
          <span class="drawer-tab">合同记录</span>
        </div>
      </header>
      <div class="drawer-body">
        <cs-descriptions>
          <div class="desc-group">
            <div class="desc-title">工作信息</div>
            <div class="desc-grid">
              <div class="desc-item"><span class="desc-label">工号</span><span class="desc-value">354615561</span></div>
              <div class="desc-item"><span class="desc-label">部门</span><span class="desc-value">设计部</span></div>
            </div>
          </div>
        </cs-descriptions>
      </div>
    </div>
  </cs-drawer>
</body>
</html>
