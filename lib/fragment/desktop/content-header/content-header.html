<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>容器预览 — content-header</title>

  <link rel="stylesheet" href="../../../css/token.css">
  <link rel="stylesheet" href="../../../css/variable.css">
  <link rel="stylesheet" href="../../../css/base.css">
  <link rel="stylesheet" href="../../../fonts/cses-icons.css">
  <link rel="stylesheet" href="content-header.css">

  <style>
    body { margin: 24px; background: var(--cs-color-bg-secondary); }
    .label { font-size: 11px; color: var(--cs-color-text-secondary); margin-bottom: 8px; font-family: var(--font-family-cn); }
    .slot-left, .slot-right { font-size: 12px; color: var(--cs-color-text-secondary); }
  </style>
</head>
<body>
  <div class="label">content-header 预览 — 自包含模式</div>

  <cs-content-header>
    <div class="slot-left">左侧槽位（标题 / 面包屑）</div>
    <div class="slot-right">右侧槽位（搜索 / 按钮）</div>
  </cs-content-header>
</body>
</html>
