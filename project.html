<script>
/* 滚动时页面上下边缘的渐进模糊：从 v1.1 搬来（assets/gradual-blur.js，移植 React Bits GradualBlur），参数照 v1.1：桌面上下各 4.5rem（owner：高度缩短一半）、强度 1.25（owner：高度、模糊值各缩一半）、ease-out。
   zIndex -97 → 实际 3，压在导航（4）之下、页面内容之上。 */
(function () {
  if (!window.GradualBlur) return;
  var MOB = matchMedia('(max-width:760px)').matches;
  GradualBlur.mount(null, { preset: 'page-header', zIndex: -97, height: MOB ? '2.5rem' : '4.5rem', strength: MOB ? .75 : 1.25, curve: 'ease-out' });
  GradualBlur.mount(null, { preset: 'page-footer', zIndex: -97, height: MOB ? '1.75rem' : '4.5rem', strength: MOB ? .6 : 1.25, curve: 'ease-out' });
})();
</script>
